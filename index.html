/* ==========================================================
   ARRASTAR — pelo teclado, o caminho é abrir a tarefa e trocar a
   etiqueta de Situação; não há atalho no cartão.
   ========================================================== */

var pegando = null;

function verboDe(st){
  if(st === 'feito')   return 'concluiu';
  if(st === 'fazendo') return 'começou';
  if(st === 'revisao') return 'enviou para revisão';
  return 'moveu';
}

/* Prepara a escolha de revisor. Não desenha: quem chamou faz isso. */
function pedirRevisor(t, voltar){
  var sugestao = t.revisor;
  if(!sugestao){
    var livre = EQUIPE.filter(function(x){ return (t.qs||[]).indexOf(x.id)===-1 && !x.fora; })[0];
    sugestao = livre ? livre.id : (t.qs && t.qs[0]);
  }
  E.revisorEscolhido = sugestao;
  E.voltarPara = voltar || null;
  E.modal = { tipo:'revisor', id: t.id };
}

function ligarArrasto(){
  [].forEach.call(document.querySelectorAll('.ct'), function(c){
    c.addEventListener('dragstart', function(ev){
      pegando = c.getAttribute('data-id');
      setTimeout(function(){ c.classList.add('pegando'); }, 0);
      ev.dataTransfer.effectAllowed = 'move';
      try{ ev.dataTransfer.setData('text/plain', pegando); }catch(e){}
    });
    c.addEventListener('dragend', function(){ c.classList.remove('pegando'); pegando = null; });
  });

  /* O alvo é a COLUNA inteira — cabeçalho, lista, espaço vazio e o
     miolo entre cartões. Antes só o topo da lista aceitava a soltura. */
  [].forEach.call(document.querySelectorAll('.col'), function(col){
    var dentro = 0;
    col.addEventListener('dragenter', function(ev){
      ev.preventDefault(); dentro++; col.classList.add('sobre');
    });
    col.addEventListener('dragover', function(ev){
      ev.preventDefault(); ev.dataTransfer.dropEffect = 'move';
      col.classList.add('sobre');
    });
    col.addEventListener('dragleave', function(){
      dentro--; if(dentro <= 0){ dentro = 0; col.classList.remove('sobre'); }
    });
    col.addEventListener('drop', function(ev){
      ev.preventDefault(); dentro = 0; col.classList.remove('sobre');
      var id = pegando || ev.dataTransfer.getData('text/plain');
      var t = tarefa(id); if(!t) return;
      var destino = col.getAttribute('data-col');
      if(t.s === destino) return;
      if(destino === 'revisao'){ pedirRevisor(t); render(); return; }
      t.s = destino;
      registrar(verboDe(destino), t.id);
      sb.from('tarefas').update({ situacao:destino }).eq('id', t.id).then(function(r){
        if(r.error) console.error('Não consegui salvar situação:', r.error);
      });
      render();
    });
  });
}

/* Mesma regra vale para criar e para corrigir. `ignorar` é o id da
   própria sprint quando ela está sendo editada. */
function validarPeriodo(pid, ini, fim, ignorar){
  if(fim <= ini) return 'A sprint precisa terminar depois de começar.';
  var choque = sprintsDe(pid).filter(function(x){
    return x.id !== ignorar && ini <= x.fim && fim >= x.ini;
  })[0];
  if(choque) return 'Esse período encosta na Sprint ' + choque.n + ' (' + faixaSprint(choque) + ').';
  return '';
}

function registrar(verbo, alvo){
  var agora = new Date().toISOString();
  FEED.unshift({ id:'f'+(++SEQ), q: eu().id, v: verbo, alvo: alvo, criado_em: agora });
  if(FEED.length > 22) FEED.pop();
  sb.from('atividades').insert({ tarefa_id: alvo, autor_id: eu().id, verbo: verbo }).then(function(r){
    if(r.error) console.error('Não consegui gravar atividade:', r.error);
  });
}

        id: ins.data.id, p:pid, t:titulo, desc:desc, qs:quems, d:prazo, s:situ,
        spr:sprId, ent:entId, dep:null, revisor:null, rep:null,
        subs:[], coments:[], anexos:[]
      };
      TAREFAS.push(nova);
      registrar('criou', nova.id);
      /* Nasceu na coluna de revisão: precisa dizer quem revisa. */
      if(col === 'revisao'){ pedirRevisor(nova); render(); return; }
      E.modal = null;
      render();
    })();
    return false;
  },

  /* --- espaço / projeto: criar, editar, apagar ------------------ */
  'novo-projeto': function(el){
    E.modal={ tipo:'novo-projeto', id: el.getAttribute('data-id') || E.espacoAberto || (ESPACOS[0] && ESPACOS[0].id) };
    E.erroCrud = '';
  },
  'editar-projeto': function(el){
    E.modal = { tipo:'editar-projeto', id: el.getAttribute('data-id') };
    E.confirmandoExclusao = null; E.erroCrud = '';
  },
  'salvar-projeto': function(el){
    var nn = document.getElementById('np-n');
    if(!nn.value.trim()){ nn.focus(); return false; }
    var nome = nn.value.trim();
    var desc = document.getElementById('np-d').value.trim() || 'Sem descrição ainda.';
    var espId = document.getElementById('np-e').value;
    var prazoIso = document.getElementById('np-p').value || null;
    var idEditando = el.getAttribute('data-id');

    (async function(){
      if(idEditando){
        var r = await sb.from('projetos')
          .update({ nome:nome, descricao:desc, espaco_id:espId, prazo:prazoIso })
          .eq('id', idEditando);
        if(r.error){ E.erroCrud = 'Não consegui salvar. Tenta de novo.'; render(); return; }
        var p = projeto(idEditando);
        p.nome = nome; p.desc = desc; p.esp = espId; p.prazo = prazoIso ? offDe(prazoIso) : null;
        E.modal = null; E.espacoAberto = espId; E.expandidos[espId] = true;
      } else {
        var ins = await sb.from('projetos')
          .insert({ nome:nome, descricao:desc, espaco_id:espId, prazo:prazoIso })
          .select().single();
        if(ins.error){ E.erroCrud = 'Não consegui criar. Tenta de novo.'; render(); return; }
        var novoId = ins.data.id;
        PROJETOS.push({ id:novoId, esp:espId, nome:nome, desc:desc, prazo: prazoIso?offDe(prazoIso):null });
        E.modal = null; E.tela = 'projeto'; E.projetoAberto = novoId;
        E.espacoAberto = espId; E.expandidos[espId] = true;
      }
      render();
    })();
    return false;
  },
  'excluir-projeto': function(el){
    var id = el.getAttribute('data-id');
    (async function(){
      var r = await sb.from('projetos').delete().eq('id', id);
      if(r.error){ E.erroCrud = 'Não consegui apagar. Tenta de novo.'; E.confirmandoExclusao = null; render(); return; }
      var i = PROJETOS.findIndex(function(x){ return x.id===id; });
      if(i>-1) PROJETOS.splice(i,1);
      /* O banco já cascateou tarefas/entregas/sprints deste projeto —
         limpa o espelho local pra não sobrar referência morta nele. */
      for(var k=TAREFAS.length-1;k>=0;k--){ if(TAREFAS[k].p===id) TAREFAS.splice(k,1); }
      for(var k2=ENTREGAS.length-1;k2>=0;k2--){ if(ENTREGAS[k2].p===id) ENTREGAS.splice(k2,1); }
      for(var k3=SPRINTS.length-1;k3>=0;k3--){ if(SPRINTS[k3].p===id) SPRINTS.splice(k3,1); }
      E.confirmandoExclusao = null; E.modal = null;
      if(E.projetoAberto === id){ E.tela = 'espaco'; E.projetoAberto = null; }
      render();
    })();
    return false;
  },

  'novo-espaco': function(){ E.modal={ tipo:'novo-espaco' }; E.novoTom='ciano'; E.erroCrud=''; },
  'editar-espaco': function(el){
    var id = el.getAttribute('data-id');
    E.modal = { tipo:'editar-espaco', id:id };
    E.novoTom = espaco(id).tom;
    E.confirmandoExclusao = null; E.erroCrud = '';
  },
  'tom': function(el){ E.novoTom = el.getAttribute('data-v'); },
  'salvar-espaco': function(el){
    var nn = document.getElementById('ne-n');
    if(!nn.value.trim()){ nn.focus(); return false; }
    var nome = nn.value.trim();
    var desc = document.getElementById('ne-d').value.trim() || 'Sem descrição ainda.';
    var tom = E.novoTom;
    var idEditando = el.getAttribute('data-id');

    (async function(){
      if(idEditando){
        var r = await sb.from('espacos').update({ nome:nome, descricao:desc, tom:tom }).eq('id', idEditando);
        if(r.error){ E.erroCrud = 'Não consegui salvar. Tenta de novo.'; render(); return; }
        var e = espaco(idEditando);
        e.nome = nome; e.desc = desc; e.tom = tom;
        E.modal = null;
      } else {
        var ins = await sb.from('espacos').insert({ nome:nome, descricao:desc, tom:tom }).select().single();
        if(ins.error){ E.erroCrud = 'Não consegui criar. Tenta de novo.'; render(); return; }
        var novoId = ins.data.id;
        ESPACOS.push({ id:novoId, nome:nome, tom:tom, desc:desc });
        E.modal = null; E.tela = 'espaco'; E.espacoAberto = novoId; E.projetoAberto = null; E.expandidos[novoId] = true;
      }
      render();
    })();
    return false;
  },
  'excluir-espaco': function(el){
    var id = el.getAttribute('data-id');
    (async function(){
      var r = await sb.from('espacos').delete().eq('id', id);
      if(r.error){
        E.erroCrud = (r.error.code === '23503')
          ? 'Esse Espaço ainda tem projetos dentro. Apague ou mova os projetos primeiro.'
          : 'Não consegui apagar. Tenta de novo.';
        E.confirmandoExclusao = null; render(); return;
      }
      var i = ESPACOS.findIndex(function(x){ return x.id===id; });
      if(i>-1) ESPACOS.splice(i,1);
      E.confirmandoExclusao = null; E.modal = null;
      if(E.espacoAberto === id){ E.tela = 'inicio'; E.espacoAberto = null; E.projetoAberto = null; }
      render();
    })();
    return false;
  }
};

/* ==========================================================
   LIGAÇÃO
   ========================================================== */

document.addEventListener('click', function(ev){
  var veu = ev.target.closest ? ev.target.closest('.veu') : null;
  if(veu && ev.target === veu){ E.modal=null; render(); return; }
  var el = ev.target.closest ? ev.target.closest('[data-a]') : null;
  if(!el) return;
  var fn = ACOES[el.getAttribute('data-a')];
  if(!fn) return;
  ev.preventDefault();
  if(fn(el) === false) return;
  render();
});

document.addEventListener('change', function(ev){
  /* Trocar o projeto na criação de tarefa reconstrói a lista de entregáveis.
     Precisa mover o próprio E.modal.id: é dele que o modal tira o projeto. */
  if(ev.target.getAttribute && ev.target.getAttribute('data-recarrega')){
    if(E.modal && E.modal.tipo === 'nova-tarefa') E.modal.id = ev.target.value;
    render(); return;
  }

  var el = ev.target.closest ? ev.target.closest('[data-campo]') : null;
  if(!el) return;
  var c = el.getAttribute('data-campo');
  var id = el.getAttribute('data-id');

  if(c.indexOf('e-') === 0){
    var g = entrega(id); if(!g) return;
    var patchG = null;
    if(c === 'e-nome'){ g.nome = el.value.trim() || g.nome; patchG = { nome:g.nome }; }
    if(c === 'e-desc'){ g.desc = el.value.trim(); patchG = { descricao:g.desc }; }
    if(c === 'e-ini' || c === 'e-fim'){
      var v = offDe(el.value);
      /* O período não pode se inverter. Recusa e mantém o que valia. */
      if(c === 'e-ini' && v > g.fim){
        E.erroEntrega = 'O começo não pode ser depois da entrega.'; render(); return;
      }
      if(c === 'e-fim' && v < g.ini){
        E.erroEntrega = 'A entrega não pode ser antes do começo.'; render(); return;
      }
      if(c === 'e-ini'){ g.ini = v; patchG = { inicio: isoDe(v) }; }
      else { g.fim = v; patchG = { fim: isoDe(v) }; }
    }
    E.erroEntrega = '';
    if(patchG){
      sb.from('entregas').update(patchG).eq('id', g.id).then(function(r){
        if(r.error) console.error('Não consegui salvar entrega:', r.error);
      });
    }
    render(); return;
  }

  var t = tarefa(id); if(!t) return;
  var patchT = null;
  if(c === 't')    { t.t = el.value.trim() || t.t; el.value = t.t; patchT = { titulo: t.t }; }
  if(c === 'd')    { t.d = offDe(el.value); patchT = { prazo: isoDe(t.d) }; }
  if(c === 'desc') { t.desc = el.value.trim(); patchT = { descricao: t.desc }; }
  if(c === 'ent')  { t.ent = el.value || null; patchT = { entrega_id: t.ent }; }
  if(c === 'rep')  { t.rep = el.value || null; patchT = { recorrencia: t.rep }; }
  if(c === 'dep')  { t.dep = el.value || null; patchT = { dependencia_id: t.dep }; }
  if(patchT){
    sb.from('tarefas').update(patchT).eq('id', t.id).then(function(r){
      if(r.error) console.error('Não consegui salvar tarefa:', r.error);
    });
  }
  render();
});

document.addEventListener('keydown', function(ev){
  if(ev.key === 'Escape' && E.confirmandoExclusao){
    E.confirmandoExclusao = null; render(); return;
  }
  if(ev.key === 'Escape' && E.modal){ E.modal = null; render(); return; }
  if(ev.key === 'Enter' && ev.target && ev.target.classList && ev.target.classList.contains('pin-input')){
    var campoEnter = ev.target.getAttribute('data-campo');
    if(campoEnter === 'entrar'   && E.authPin.length === 6)         tentarEntrar();
    if(campoEnter === 'novo'     && E.authPinNovo.length === 6)     { E.authPasso = 'confirmar'; render(); }
    if(campoEnter === 'confirma' && E.authPinConfirma.length === 6) tentarCadastrar();
    return;
  }
  /* O cartão é uma div arrastável com papel de botão: o teclado
     precisa ser tratado à mão, já que não é um <button> de verdade. */
  if(ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar'){
    var alvo = ev.target.closest ? ev.target.closest('[role="button"][data-a]') : null;
    if(alvo){ ev.preventDefault(); alvo.click(); }
  }
});

/* O PIN atualiza os pontinhos a cada tecla sem passar por render() —
   um redesenho completo a cada dígito perderia o foco do campo e é
   trabalho à toa para uma barra de 6 bolinhas. Existem três campos
   de PIN (entrar / definir / confirmar); "campo" distingue qual. */
document.addEventListener('input', function(ev){
  var el = ev.target;
  if(!el || !el.classList || !el.classList.contains('pin-input')) return;
  var v = el.value.replace(/\D/g, '').slice(0, 6);
  if(v !== el.value) el.value = v;
  var campo = el.getAttribute('data-campo');
  if(campo === 'entrar')   E.authPin = v;
  if(campo === 'novo')     E.authPinNovo = v;
  if(campo === 'confirma') E.authPinConfirma = v;
  E.authErro = '';
  var area = el.closest('.pin-area');
  if(area) area.classList.remove('treme');
  var dots = document.getElementById('pin-dots-'+campo);
  if(dots){
    [].forEach.call(dots.querySelectorAll('.pin-dot'), function(dot, i){
      dot.classList.toggle('cheio', i < v.length);
    });
  }
  if(v.length === 6){
    if(campo === 'entrar')   tentarEntrar();
    if(campo === 'novo')     { E.authPasso = 'confirmar'; render(); }
    if(campo === 'confirma') tentarCadastrar();
  }
});

window.addEventListener('resize', posicionarSeg);
/* A pastilha é medida em pixels. No primeiro render a fonte do Google
   ainda não chegou, as abas têm outra largura, e ela fica torta até o
   próximo render. Reposiciona quando a fonte assenta. */
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(posicionarSeg); }
window.addEventListener('load', posicionarSeg);

/* Fonte única de verdade sobre sessão: dispara no carregamento
   (restaurando sessão salva, se houver) e a cada login/logout. */
sb.auth.onAuthStateChange(async function(evento, sessao){
  if(sessao && sessao.user){
    await Promise.all([
      carregarPerfilReal(sessao.user.id),
      carregarPessoasReais(),
      carregarEspacos(),
      carregarProjetos(),
      carregarSprints(),
      carregarEntregas(),
      carregarTarefas(),
      carregarAtividades()
    ]);
    E.autenticado = true;
  } else {
    E.autenticado = false;
    PERFIL_REAL = null;
  }
  E.autPronto = true;
  render();
});

render();
