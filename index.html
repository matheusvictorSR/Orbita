<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Órbita — gestão de projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   ÓRBITA — sistema de gestão de projetos
   O acento é uma variável viva: entrar num Espaço transiciona
   a cor de todo o app de uma vez só.
   ========================================================== */

@property --acento      { syntax:'<color>'; inherits:true; initial-value:#5B4BFF; }
@property --acento-fundo{ syntax:'<color>'; inherits:true; initial-value:#EFEDFF; }
@property --acento-texto{ syntax:'<color>'; inherits:true; initial-value:#4A38F0; }
@property --acento-solido{ syntax:'<color>'; inherits:true; initial-value:#5B4BFF; }

:root{
  --fundo:        #F2F3F7;
  --sup:          #FFFFFF;
  --sup-2:        #FAFAFC;
  --sup-3:        #F5F6FA;
  --borda:        #E7E8EF;
  --borda-2:      #D8DAE5;
  --tinta:        #0E0E16;
  --tinta-2:      #61637A;
  --tinta-3:      #676A7C;

  --ok:      #00744A;
  --ok-viv:  #00A86B;
  --ok-bg:   #E2FAF1;
  --alerta:      #8A5600;
  --alerta-viv:  #FF9F0A;
  --alerta-bg:   #FFF3E0;
  --erro:      #C4162E;
  --erro-viv:  #FF3B52;
  --erro-bg:   #FFEBEE;

  --ui:   'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;

  --r-s: 8px;
  --r-m: 12px;
  --r-g: 18px;
  --r-xg: 26px;

  --mola:  cubic-bezier(.32,.72,0,1);
  --suave: cubic-bezier(.4,0,.2,1);

  --s-1: 0 1px 2px rgba(14,14,22,.05), 0 1px 1px rgba(14,14,22,.03);
  --s-2: 0 2px 6px rgba(14,14,22,.06), 0 8px 24px -8px rgba(14,14,22,.10);
  --s-3: 0 12px 32px -8px rgba(14,14,22,.16), 0 2px 8px rgba(14,14,22,.06);
  --s-4: 0 32px 80px -16px rgba(14,14,22,.30), 0 8px 24px -8px rgba(14,14,22,.14);

  --lateral: 254px;
}

/* O acento vive no <html>, que sobrevive a cada render — por isso
   a troca de Espaço consegue transicionar a cor do app inteiro. */
html{
  transition: --acento .55s var(--suave), --acento-fundo .55s var(--suave),
              --acento-texto .55s var(--suave), --acento-solido .55s var(--suave);
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }

body{
  background: var(--fundo);
  color: var(--tinta);
  font-family: var(--ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0; }
input,select,textarea{ font:inherit; color:inherit; }
h1,h2,h3,h4{ margin:0; font-weight:700; letter-spacing:-.022em; }
h1{ font-size: 27px; font-weight:800; letter-spacing:-.032em; }
h2{ font-size: 17px; }
h3{ font-size: 15px; }
p{ margin:0; }
ul{ margin:0; padding:0; list-style:none; }

:focus-visible{
  outline: 2.5px solid var(--acento);
  outline-offset: 2px;
  border-radius: 6px;
}

.mono{ font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing:-.02em; }
.oculto{ display:none !important; }
.so-leitor{ position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.rot{
  font-size: 11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color: var(--tinta-3);
}

::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:#D3D5E0; border-radius:10px; border:3px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-thumb:hover{ background:#B9BCCC; background-clip:content-box; border:3px solid transparent; }

/* ==========================================================
   MOVIMENTO
   ========================================================== */

@keyframes entra{
  from{ opacity:0; transform: translateY(9px) scale(.994); }
  to  { opacity:1; transform: none; }
}
@keyframes sobe{
  from{ opacity:0; transform: translateY(14px); }
  to  { opacity:1; transform: none; }
}
@keyframes veuEntra{ from{ opacity:0; } to{ opacity:1; } }
@keyframes folhaEntra{
  0%  { opacity:0; transform: translateY(18px) scale(.96); }
  100%{ opacity:1; transform: none; }
}
@keyframes cresceX{ from{ transform: scaleX(0); } to{ transform: scaleX(1); } }
@keyframes cresceY{ from{ transform: scaleY(0); } to{ transform: scaleY(1); } }
@keyframes pulso{
  0%  { box-shadow: 0 0 0 0 color-mix(in oklab, var(--acento) 45%, transparent); }
  100%{ box-shadow: 0 0 0 11px transparent; }
}
@keyframes brilho{
  from{ opacity:.55; }
  to  { opacity:0; }
}

/* a entrada escalonada só toca quando a vista muda, nunca a cada clique */
.animar > *{ animation: entra .46s var(--mola) backwards; animation-delay: calc(var(--i,0) * 34ms); }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important; scroll-behavior:auto !important;
  }
}

/* ==========================================================
   ESQUELETO
   ========================================================== */

#app{ display:flex; height:100vh; overflow:hidden; }

/* ---------- barra lateral ---------- */

.lateral{
  width: var(--lateral); flex:none;
  height:100vh; display:flex; flex-direction:column;
  background: rgba(255,255,255,.72);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border-right: 1px solid var(--borda);
}

.marca{ display:flex; align-items:center; gap:8px; padding: 20px 18px 16px; }
/* A logo é a identidade do produto — fica sempre no azul de marca,
   não segue o acento vivo do Espaço (esse é só para navegação).
   Sem moldura: o desenho é a logo, não um ícone dentro de um chip. */
.marca-p{ flex:none; display:grid; place-items:center; }
.marca-p svg{ display:block; }
.marca-n{ font-size: 16.5px; font-weight:800; letter-spacing:-.032em; }

.nav{ flex:1; overflow-y:auto; padding: 2px 10px 16px; }

.nav-i{
  width:100%; display:flex; align-items:center; gap:10px;
  padding: 8px 10px; border-radius: var(--r-s);
  font-size: 14px; font-weight:600; color: var(--tinta-2);
  transition: background .18s var(--suave), color .18s var(--suave);
}
.nav-i:hover{ background: rgba(14,14,22,.045); color: var(--tinta); }
.nav-i[aria-current="page"]{ background: var(--acento-fundo); color: var(--acento-texto); }
.nav-i[aria-current="page"] svg{ color: var(--acento); }
.nav-i svg{ flex:none; color: var(--tinta-3); transition: color .18s var(--suave); }

.nav-cab{
  display:flex; align-items:center; gap:8px;
  padding: 20px 10px 7px;
}
.nav-cab .rot{ font-size: 10.5px; }
.mais{
  margin-left:auto; width:22px; height:22px; border-radius:6px;
  display:grid; place-items:center; color: var(--tinta-3);
  transition: background .16s, color .16s, transform .3s var(--mola);
}
.mais:hover{ background: rgba(14,14,22,.06); color: var(--tinta); transform: rotate(90deg); }

/* espaço na lateral, com sanfona animada */
.esp{ margin-bottom: 1px; }
.esp-b{
  width:100%; display:flex; align-items:center; gap:9px;
  padding: 7px 10px; border-radius: var(--r-s);
  font-size: 13.5px; font-weight:600; color: var(--tinta-2);
  transition: background .18s var(--suave), color .18s var(--suave);
}
.esp-b:hover{ background: rgba(14,14,22,.045); color: var(--tinta); }
.esp-b[aria-current="page"]{ color: var(--tinta); background: rgba(14,14,22,.05); }
.ponto{
  width: 9px; height: 9px; border-radius: 50%; flex:none;
  background: var(--c); box-shadow: 0 0 0 3px color-mix(in oklab, var(--c) 16%, transparent);
  transition: box-shadow .25s var(--suave), transform .3s var(--mola);
}
.esp-b:hover .ponto{ transform: scale(1.18); }
.esp-nome{ flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chevron{ flex:none; color: var(--tinta-3); transition: transform .34s var(--mola); }
.esp.aberto .chevron{ transform: rotate(90deg); }

.esp-sub{ display:grid; grid-template-rows: 0fr; transition: grid-template-rows .38s var(--mola); }
.esp.aberto .esp-sub{ grid-template-rows: 1fr; }
.esp-sub-i{ overflow:hidden; }
.esp-sub ul{ padding: 2px 0 6px 22px; position:relative; }
.esp-sub ul::before{
  content:""; position:absolute; left: 9px; top: 4px; bottom: 10px;
  width: 1.5px; border-radius:2px; background: color-mix(in oklab, var(--c) 28%, transparent);
}
.proj-b{
  width:100%; text-align:left; padding: 6px 10px; border-radius: 7px;
  font-size: 13px; font-weight:500; color: var(--tinta-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  transition: background .16s, color .16s;
}
.proj-b:hover{ background: rgba(14,14,22,.045); color: var(--tinta); }
.proj-b[aria-current="page"]{ background: var(--acento-fundo); color: var(--acento-texto); font-weight:600; }

/* rodapé da lateral */
.lat-pe{ padding: 12px 16px 16px; border-top: 1px solid var(--borda); }
.time-l{ display:flex; align-items:center; gap:7px; }
.eu-l{ display:flex; align-items:center; gap:9px; }
.eu-nome{ font-size:13px; font-weight:650; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sair-b{
  display:flex; align-items:center; gap:5px; flex:none;
  font-size:11.5px; font-weight:650; color: var(--tinta-3);
  padding:6px 9px; border-radius:9px;
  transition: background .16s var(--suave), color .16s var(--suave);
}
.sair-b:hover{ background: var(--erro-bg); color: var(--erro); }
.pilha{ display:flex; }
.pilha .av{ margin-left:-7px; box-shadow: 0 0 0 2.5px var(--sup); }
.pilha .av:first-child{ margin-left:0; }
.time-t{ font-size: 12px; color: var(--tinta-3); margin-left: 4px; }

.av{
  width: 26px; height: 26px; border-radius:50%; flex:none;
  display:grid; place-items:center;
  font-size: 10.5px; font-weight:700; letter-spacing:-.01em;
  color:#fff; background: var(--c, #8B8DA0);
}
.av.g{ width:32px; height:32px; font-size:12px; }
.av.p{ width:22px; height:22px; font-size:9.5px; }
.av.ausente{ opacity:.42; }

/* ==========================================================
   ÁREA PRINCIPAL
   ========================================================== */

.principal{ flex:1; min-width:0; height:100vh; overflow-y:auto; position:relative; scroll-behavior:smooth; }

.topo{
  position:sticky; top:0; z-index:20;
  background: color-mix(in oklab, var(--fundo) 78%, transparent);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid transparent;
  transition: border-color .25s var(--suave);
}
.topo.colado{ border-bottom-color: var(--borda); }
.topo-i{ display:flex; align-items:center; gap:14px; padding: 16px 34px; max-width:1320px; margin:0 auto; }
.trilha{ display:flex; align-items:center; gap:8px; font-size: 13px; color: var(--tinta-3); font-weight:600; }
.trilha button{ color: var(--tinta-3); transition: color .16s; }
.trilha button:hover{ color: var(--tinta); }
.trilha .sep{ opacity:.55; }
.trilha .atual{ color: var(--tinta); }
.topo-dir{ margin-left:auto; display:flex; align-items:center; gap:9px; }

.conteudo{ padding: 6px 34px 96px; max-width:1320px; margin:0 auto; }

.cab-vista{ display:flex; align-items:flex-end; gap:18px; padding: 12px 0 26px; flex-wrap:wrap; }
.cab-vista p{ font-size: 14.5px; color: var(--tinta-2); margin-top: 7px; }
.cab-vista .dir{ margin-left:auto; display:flex; gap:9px; flex:none; }

/* ==========================================================
   BOTÕES
   ========================================================== */

.b{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height: 38px; padding: 0 16px; border-radius: 10px;
  font-size: 13.5px; font-weight:650; letter-spacing:-.008em;
  white-space:nowrap;
  transition: background .18s var(--suave), box-shadow .22s var(--suave),
              transform .22s var(--mola), color .18s var(--suave);
}
.b:active{ transform: scale(.965); }

.b-p{ background: var(--acento-solido); color:#fff;
      box-shadow: 0 2px 8px -1px color-mix(in oklab, var(--acento-solido) 45%, transparent); }
.b-p:hover{ box-shadow: 0 6px 18px -3px color-mix(in oklab, var(--acento-solido) 60%, transparent); filter: brightness(1.08); }

.b-s{ background: var(--sup); color: var(--tinta); box-shadow: var(--s-1), inset 0 0 0 1px var(--borda-2); }
.b-s:hover{ background: var(--sup-2); box-shadow: var(--s-2), inset 0 0 0 1px var(--borda-2); }

.b-f{ background: transparent; color: var(--tinta-2); }
.b-f:hover{ background: rgba(14,14,22,.055); color: var(--tinta); }

/* destrutivo: discreto em repouso, inequívoco na confirmação */
.b-perigo{ background: transparent; color: var(--tinta-2); }
.b-perigo:hover{ background: var(--erro-bg); color: var(--erro); }
.b-perigo-solido{ background: var(--erro); color:#fff; box-shadow: 0 2px 8px -1px color-mix(in oklab, var(--erro) 45%, transparent); }
.b-perigo-solido:hover{ filter: brightness(1.08); box-shadow: 0 6px 18px -3px color-mix(in oklab, var(--erro) 60%, transparent); }

.f-pe.confirmando{ background: linear-gradient(to top, var(--erro-bg) 68%, transparent); }
.f-conf{ font-size: 12.5px; color: var(--erro); font-weight:600; flex:1; min-width:0; line-height:1.4; }
.f-dica{ font-size: 11.5px; color: var(--tinta-3); margin-top: 8px; display:block; line-height:1.45; }

.b-i{ width:38px; padding:0; }
.b-pq{ height:32px; padding:0 12px; font-size:12.5px; border-radius:9px; }

/* ==========================================================
   CARTÕES DE RESUMO — o desenho é o dado, não enfeite
   ========================================================== */

.resumo{ display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin-bottom: 26px; }

.rc{
  background: var(--sup); border-radius: var(--r-g); padding: 18px 20px 17px;
  box-shadow: var(--s-1); position:relative; overflow:hidden;
  transition: box-shadow .3s var(--suave), transform .3s var(--mola);
}
.rc:hover{ box-shadow: var(--s-2); transform: translateY(-2px); }
.rc-t{ display:flex; align-items:baseline; gap:9px; }
.rc-n{ font-size: 30px; font-weight:800; letter-spacing:-.04em; line-height:1; }
.rc-r{ font-size: 13px; font-weight:600; color: var(--tinta-2); }
.rc-viz{ margin-top: 16px; }

/* barrinhas: uma por projeto, na cor do Espaço */
.viz-barras{ display:flex; gap:4px; align-items:flex-end; height: 30px; }
.viz-barras span{
  flex:1; border-radius: 3px; background: var(--c);
  transform-origin: bottom; animation: cresceY .55s var(--mola) backwards;
  animation-delay: calc(var(--i,0) * 45ms);
}

/* tira de 7 dias com ponto nos dias que têm vencimento */
.viz-dias{ display:grid; grid-template-columns: repeat(7,1fr); gap:5px; }
.vd{ text-align:center; }
.vd-d{ font-size: 9.5px; font-weight:700; color: var(--tinta-3); text-transform:uppercase; letter-spacing:.03em; }
.vd-c{
  margin-top:5px; height: 22px; border-radius: 7px; background: var(--sup-3);
  display:grid; place-items:center;
  transition: background .2s var(--suave);
}
.vd.tem .vd-c{ background: var(--acento-fundo); }
.vd.tem .vd-p{
  width:6px; height:6px; border-radius:50%; background: var(--acento);
  animation: entra .5s var(--mola) backwards; animation-delay: calc(var(--i,0) * 55ms);
}
.vd.hoje .vd-d{ color: var(--acento-texto); }
.vd.hoje .vd-c{ box-shadow: inset 0 0 0 1.5px var(--acento); }

/* barra segmentada de "em dia" */
.viz-seg{ display:flex; gap:3px; height: 22px; align-items:stretch; }
.viz-seg span{
  flex:1; border-radius:3px; background: var(--sup-3);
  transform-origin:left; animation: cresceX .5s var(--mola) backwards;
  animation-delay: calc(var(--i,0) * 28ms);
}
.viz-seg span.on{ background: var(--ok-viv); }
.viz-seg span.off{ background: var(--erro-viv); }

/* ==========================================================
   PAINÉIS LADO A LADO
   ========================================================== */

.paineis{ display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 14px; align-items:start; }

.painel{
  background: var(--sup); border-radius: var(--r-g);
  box-shadow: var(--s-1); overflow:hidden;
}
.painel-cab{
  display:flex; align-items:center; gap:10px;
  padding: 16px 20px 13px;
}
.painel-cab h2{ font-size: 15px; letter-spacing:-.024em; }
.painel-cab .cont{
  font-family: var(--mono); font-size:11.5px; font-weight:500;
  color: var(--tinta-3); background: var(--sup-3);
  padding: 2px 7px; border-radius: 20px;
}
.painel-cab .b-f{ margin-left:auto; }
.painel-corpo{ padding: 0 10px 10px; }

/* linha de atualização */
.at{
  display:flex; gap:11px; padding: 10px; border-radius: var(--r-m);
  width:100%; text-align:left;
  transition: background .16s var(--suave);
}
.at:hover{ background: var(--sup-3); }
.at-txt{ flex:1; min-width:0; font-size: 13.5px; line-height:1.45; display:block; }
.at-txt b{ font-weight:700; }
.at-alvo{ font-weight:600; }
.at-pe{ display:flex; align-items:center; gap:7px; margin-top:4px; }
.at-h{ font-family: var(--mono); font-size: 11px; color: var(--tinta-3); flex:none; }

.selo{
  display:inline-flex; align-items:center; gap:5px;
  font-size: 11px; font-weight:650; letter-spacing:-.005em;
  padding: 2px 8px 2px 6px; border-radius: 20px;
  background: color-mix(in oklab, var(--c) 11%, white);
  color: var(--cd);
  white-space:nowrap;
}
.selo::before{ content:""; width:5px; height:5px; border-radius:50%; background: var(--c); flex:none; }

/* linha de prazo */
.pz{
  display:flex; align-items:center; gap:11px; padding: 10px; border-radius: var(--r-m);
  width:100%; text-align:left;
  transition: background .16s var(--suave);
}
.pz:hover{ background: var(--sup-3); }
.pz-b{ width:3px; align-self:stretch; border-radius:3px; background: var(--c); flex:none; }
.pz-c{ flex:1; min-width:0; }
.pz-t{ display:block; font-size: 13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pz-s{ display:block; font-size: 11.5px; color: var(--tinta-3); margin-top:2px;
       overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pz-q{ flex:none; }
.pz-d{
  flex:none; text-align:right; font-family: var(--mono);
  font-size: 12px; font-weight:500; color: var(--tinta-2); min-width: 62px;
}
.pz-d.perto{ color: var(--alerta); }
.pz-d.venceu{ color: var(--erro); }

.vazio-p{ padding: 26px 12px; text-align:center; font-size: 13px; color: var(--tinta-3); }

/* ==========================================================
   CABEÇALHO DE ESPAÇO — a única lavagem grande de cor
   ========================================================== */

.esp-cab{
  position:relative; overflow:hidden;
  border-radius: var(--r-xg);
  background: var(--sup);
  box-shadow: var(--s-1);
  padding: 26px 28px 24px;
  margin-bottom: 22px;
}
.esp-cab::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(120% 150% at 0% 0%, color-mix(in oklab, var(--acento) 20%, transparent) 0%, transparent 62%),
    radial-gradient(90% 130% at 100% 0%, color-mix(in oklab, var(--acento) 9%, transparent) 0%, transparent 58%);
  transition: background .5s var(--suave);
}
.esp-cab > *{ position:relative; }
.esp-cab h1{ display:flex; align-items:center; gap:12px; }
.esp-cab .ponto{ width:13px; height:13px; }
.esp-cab .dir{ margin-left:auto; }

.esp-num{ display:flex; gap:30px; margin-top: 20px; }
.en{ display:flex; flex-direction:column; gap:3px; }
.en-n{ font-size: 21px; font-weight:800; letter-spacing:-.032em; line-height:1.1; }
.en-r{ font-size: 12px; font-weight:600; color: var(--tinta-2); }

/* ---------- grade de projetos ---------- */

.grade{ display:grid; grid-template-columns: repeat(auto-fill, minmax(288px,1fr)); gap: 14px; }

.pc{
  background: var(--sup); border-radius: var(--r-g); padding: 18px 19px 16px;
  box-shadow: var(--s-1); text-align:left; width:100%;
  position:relative; overflow:hidden;
  transition: box-shadow .3s var(--suave), transform .3s var(--mola);
}
.pc::after{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background: var(--c); opacity:0; transition: opacity .25s var(--suave);
}
.pc:hover{ box-shadow: var(--s-3); transform: translateY(-3px); }
.pc:hover::after{ opacity:1; }

.pc-t{ display:flex; align-items:flex-start; gap:10px; }
.pc-n{ font-size: 15.5px; font-weight:700; letter-spacing:-.022em; line-height:1.32; }
.pc-sit{ margin-left:auto; flex:none; }
.pc-d{ font-size: 12.5px; color: var(--tinta-2); margin-top: 6px; line-height:1.45; }

.pc-pe{ display:flex; align-items:center; gap:10px; margin-top: 16px; }
.trilho{ flex:1; height: 5px; border-radius: 4px; background: var(--sup-3); overflow:hidden; }
.trilho i{
  display:block; height:100%; border-radius:4px; background: var(--c);
  transform-origin:left; animation: cresceX .7s var(--mola) backwards; animation-delay:.1s;
}
.pc-pct{ font-family: var(--mono); font-size: 11.5px; color: var(--tinta-3); flex:none; }
.pc-l{ display:flex; align-items:center; gap:10px; margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--borda); }
.pc-prazo{ font-family: var(--mono); font-size: 11.5px; color: var(--tinta-2); }
.pc-l .pilha{ margin-left:auto; }

/* estado / situação */
.sit{
  display:inline-flex; align-items:center; gap:5px;
  font-size: 11px; font-weight:700; letter-spacing:-.005em;
  padding: 3px 9px 3px 7px; border-radius: 20px; white-space:nowrap;
}
.sit::before{ content:""; width:5px; height:5px; border-radius:50%; background:currentColor; flex:none; }
.s-ok{     background: var(--ok-bg);     color: var(--ok); }
.s-alerta{ background: var(--alerta-bg); color: var(--alerta); }
.s-erro{   background: var(--erro-bg);   color: var(--erro); }
.s-neutro{ background: var(--sup-3);     color: var(--tinta-2); }

/* ==========================================================
   PROJETO
   ========================================================== */

.seg{
  display:inline-flex; padding: 3px; border-radius: 11px;
  background: var(--sup-3); position:relative;
}
.seg button{
  position:relative; z-index:1;
  padding: 6px 15px; border-radius: 8px;
  font-size: 13px; font-weight:650; color: var(--tinta-2);
  transition: color .22s var(--suave);
}
.seg button[aria-selected="true"]{ color: var(--tinta); }
.seg-p{
  position:absolute; top:3px; bottom:3px; z-index:0;
  background: var(--sup); border-radius: 8px; box-shadow: var(--s-1);
  transition: left .38s var(--mola), width .38s var(--mola);
}

/* quadro */
/* Quadro: cada etapa tem moldura própria. É a única cor do app que
   NÃO segue o acento do Espaço — o fluxo é o mesmo em todo lugar.
   Cada etapa usa os mesmos quatro tons da identidade:
   --cc vivo (moldura e ponto) · --ct texto · --cw lavagem de fundo */
.quadro{ display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; align-items:stretch; }

.col{
  min-width: 0;
  --cc: #9295A8; --ct: var(--tinta-2); --cw: var(--sup-3); --cm: #C7CAD6;
  display:flex; flex-direction:column;
  background: var(--cw);
  border: 1.5px solid var(--cm);
  border-radius: var(--r-g);
  padding: 12px 10px 10px;
  transition: border-color .22s var(--suave), background .22s var(--suave), box-shadow .22s var(--suave);
}
/* --cm e a moldura: precisa se ver contra o fundo do app, nao so
   contra a lavagem de dentro. O amarelo puro sumia (1,07), por isso
   a moldura dele puxa para ambar. */
.col-afazer  { --cc:#2E7BFF; --ct:#0F4FB5; --cw:#F3F7FF; --cm:#82B0FF; }
.col-fazendo { --cc:#FFC400; --ct:#8A5D00; --cw:#FFFAEB; --cm:#DAAE33; }
.col-revisao { --cc:#9B4DFF; --ct:#7422DB; --cw:#F8F3FF; --cm:#C394FF; }
.col-feito   { --cc:#12B76A; --ct:#06724A; --cw:#EFFBF5; --cm:#4BB986; }

.col-cab{ display:flex; align-items:center; gap:8px; padding: 2px 6px 12px; }
.col-pt{ width:8px; height:8px; border-radius:50%; background: var(--cc); flex:none; }
.col-cab .rot{ font-size:10.5px; letter-spacing:.07em; color: var(--ct); }
.col-cab .cont{ font-family: var(--mono); font-size:11px; color: var(--ct); opacity:.72; }
.col-cab .b-i{ margin-left:auto; width:24px; height:24px; border-radius:7px; color: var(--ct); }
.col-cab .b-i:hover{ background: color-mix(in oklab, var(--cc) 15%, transparent); }

.col-lista{ display:flex; flex-direction:column; gap:9px; flex:1; min-height: 92px; }

/* Alvo de soltura: a COLUNA INTEIRA, não só o topo da lista. */
.col.sobre{
  border-color: var(--cc);
  background: color-mix(in oklab, var(--cc) 11%, var(--cw));
  box-shadow: 0 0 0 4px color-mix(in oklab, var(--cc) 15%, transparent);
}
.col.sobre .col-lista::after{
  content:""; display:block; height: 56px; border-radius: var(--r-m); flex:none;
  border: 2px dashed color-mix(in oklab, var(--cc) 58%, transparent);
  background: color-mix(in oklab, var(--cc) 8%, transparent);
  animation: entra .3s var(--mola) backwards;
}

/* ---- anexos ---------------------------------------------- */
.anx{
  display:flex; align-items:center; gap:11px; padding: 8px 10px; border-radius: 11px;
  background: var(--sup-2); box-shadow: inset 0 0 0 1px var(--borda);
  text-decoration:none; color:inherit;
  transition: background .16s var(--suave), box-shadow .16s var(--suave), transform .22s var(--mola);
}
.anx + .anx{ margin-top: 7px; }
.anx:hover{ background: var(--sup); box-shadow: inset 0 0 0 1px var(--borda-2), var(--s-1); transform: translateY(-1px); }
.anx-i{
  width: 32px; height: 32px; border-radius: 9px; flex:none;
  display:grid; place-items:center;
  background: color-mix(in oklab, var(--ai) 12%, white); color: var(--ai);
}
.anx-c{ flex:1; min-width:0; }
.anx-n{ font-size: 13px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.anx-u{ font-size: 11px; color: var(--tinta-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.anx-x{
  width:27px; height:27px; border-radius:8px; flex:none; color: var(--tinta-3);
  display:grid; place-items:center; transition: background .16s, color .16s;
}
.anx-x:hover{ background: var(--erro-bg); color: var(--erro); }
.anx-add{ display:flex; gap:8px; margin-top:10px; }
.anx-add .ent{ height:38px; }
.drive-fut{
  display:flex; align-items:center; gap:9px; margin-top:9px; padding:9px 11px;
  border-radius:11px; border:1.5px dashed var(--borda-2);
  font-size:12.5px; color: var(--tinta-3);
}
.drive-fut b{ color: var(--tinta-2); font-weight:650; }
.drive-fut .marca-fut{
  margin-left:auto; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  background: var(--sup-3); color: var(--tinta-2); padding:2px 8px; border-radius:20px;
}

/* ---- sprint ---------------------------------------------- */
.spr{
  display:inline-flex; align-items:center; gap:5px;
  font-family: var(--mono); font-size: 10.5px; font-weight:500;
  color: var(--tinta-2); background: var(--sup-3);
  padding: 1px 7px; border-radius: 20px; box-shadow: inset 0 0 0 1px var(--borda);
}
.sprint-b{
  display:inline-flex; align-items:center; gap:9px; padding: 7px 13px; border-radius: 11px;
  background: var(--sup); box-shadow: var(--s-1), inset 0 0 0 1px var(--borda-2);
  font-size: 13px; font-weight:650;
  transition: box-shadow .2s var(--suave), transform .22s var(--mola);
}
.sprint-b:hover{ transform: translateY(-1px); box-shadow: var(--s-2), inset 0 0 0 1px var(--borda-2); }
.sprint-b .mono{ font-weight:500; color: var(--tinta-2); font-size:12px; }
.spl{
  display:flex; align-items:center; gap:11px; padding: 11px 13px; border-radius: 12px;
  background: var(--sup-2); box-shadow: inset 0 0 0 1px var(--borda);
  width:100%; text-align:left;
  transition: background .16s var(--suave), box-shadow .16s var(--suave), transform .2s var(--mola);
}
.spl + .spl{ margin-top: 8px; }
.spl.agora{ background: var(--acento-fundo); box-shadow: inset 0 0 0 1.5px var(--acento); }
button.spl:hover{ background: var(--sup-3); box-shadow: inset 0 0 0 1px var(--borda-2); transform: translateY(-1px); }
button.spl.agora:hover{ background: var(--acento-fundo); }
.spl-ed{ margin-left:8px; color: var(--tinta-3); display:grid; place-items:center; flex:none; }
button.spl:hover .spl-ed{ color: var(--acento-texto); }

/* linha em edicao: vira formulario no proprio lugar */
.spl.editando{
  flex-wrap:wrap; background: var(--sup);
  box-shadow: inset 0 0 0 1.5px var(--acento), var(--s-2);
}
.spl.editando .ent{ height: 36px; padding: 0 10px; font-size: 13px; flex:1; min-width: 132px; }
.spl-ate{ font-family: var(--mono); font-size: 12px; color: var(--tinta-3); }
.spl-acoes{ display:flex; gap:7px; margin-left:auto; }
.spl-erro{
  flex-basis:100%; font-size: 12.5px; color: var(--erro);
  background: var(--erro-bg); padding: 7px 10px; border-radius: 9px;
}
.spl-n{ font-weight:700; font-size: 13.5px; }
.spl-d{ font-family: var(--mono); font-size: 12px; color: var(--tinta-2); }
.spl-q{ margin-left:auto; font-family: var(--mono); font-size:11.5px; color: var(--tinta-3); }
.spl.agora .spl-n, .spl.agora .spl-d{ color: var(--acento-texto); }

/* ==========================================================
   BACKLOG — entregáveis do projeto
   A backlog é sobre DATAS, então a data lidera cada linha.
   ========================================================== */

.bl-topo{ display:flex; align-items:center; gap:14px; margin-bottom: 16px; flex-wrap:wrap; }
.bl-topo .cont{ font-family: var(--mono); font-size:12px; color: var(--tinta-3); }
.bl-topo .dir{ margin-left:auto; display:flex; align-items:center; gap:10px; }

.bl{ display:flex; flex-direction:column; gap: 10px; }

.bl-item{
  --ce: var(--tinta-3);
  display:flex; align-items:stretch; gap:0; width:100%; text-align:left;
  background: var(--sup); border-radius: var(--r-g); box-shadow: var(--s-1);
  overflow:hidden;
  transition: box-shadow .26s var(--suave), transform .26s var(--mola);
}
.bl-item:hover{ box-shadow: var(--s-3); transform: translateY(-2px); }

.bl-data{
  flex:none; width: 74px; padding: 15px 0 14px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  background: color-mix(in oklab, var(--ce) 12%, var(--sup));
  border-right: 1px solid color-mix(in oklab, var(--ce) 30%, transparent);
}
.bl-dia{ font-family: var(--mono); font-size: 22px; font-weight:500; line-height:1; color: var(--ce-txt); letter-spacing:-.03em; }
.bl-mes{ font-size: 10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color: var(--ce-txt); }

.bl-corpo{ flex:1; min-width:0; padding: 14px 16px 13px; }
.bl-l1{ display:flex; align-items:center; gap:10px; }
.bl-nome{ font-size: 15px; font-weight:700; letter-spacing:-.02em; overflow-wrap:anywhere; }
.bl-l1 .dir{ margin-left:auto; display:flex; align-items:center; gap:9px; flex:none; }
.bl-desc{
  font-size: 12.5px; color: var(--tinta-2); line-height:1.45; margin-top: 5px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.bl-l2{ display:flex; align-items:center; gap:11px; margin-top: 11px; }
.bl-l2 .trilho{ max-width: 120px; }
.bl-quantas{ font-family: var(--mono); font-size: 11.5px; color: var(--tinta-3); }
.bl-periodo{
  display:inline-flex; align-items:center; gap:5px;
  font-family: var(--mono); font-size: 11.5px; color: var(--tinta-2);
  background: var(--sup-3); padding: 2px 9px; border-radius: 20px;
}
.bl-periodo b{ color: var(--tinta-3); font-weight:400; }
.bl-periodo svg{ opacity:.6; }
.bl-atraso{ font-size: 11.5px; font-weight:650; color: var(--erro); }

/* situação do entregável — reaproveita o acento do Espaço em "em curso" */
.se{
  display:inline-flex; align-items:center; gap:5px;
  font-size: 11px; font-weight:700; padding: 3px 9px 3px 7px; border-radius: 20px; white-space:nowrap;
}
.se::before{ content:""; width:5px; height:5px; border-radius:50%; background:currentColor; flex:none; }
.se-planejado{ background: var(--sup-3); color: var(--tinta-2); }
.se-curso{ background: var(--acento-fundo); color: var(--acento-texto); }
.se-entregue{ background: var(--ok-bg); color: var(--ok); }
.se-atrasado{ background: var(--erro-bg); color: var(--erro); }

/* ==========================================================
   CALENDÁRIO
   ========================================================== */

.cal-cab{ display:flex; align-items:center; gap:12px; margin-bottom: 14px; flex-wrap:wrap; }
.cal-mes{ font-size: 19px; font-weight:800; letter-spacing:-.028em; text-transform:capitalize; }
.cal-ano{ font-family: var(--mono); font-size: 14px; color: var(--tinta-3); }
.cal-nav{ display:flex; gap:6px; margin-left:auto; }
.cal-nav .b-i{ width:34px; height:34px; border-radius:10px; }

.cal{
  background: var(--sup); border-radius: var(--r-g); box-shadow: var(--s-1);
  overflow:hidden;
}
.cal-dow{ display:grid; grid-template-columns: repeat(7,1fr); border-bottom:1px solid var(--borda); }
.cal-dow span{
  padding: 10px 0 9px; text-align:center;
  font-size: 10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color: var(--tinta-3);
}

/* Cada semana é uma grade de 7 colunas com pistas empilhadas:
   linha 1 = números, linhas do meio = barras de entrega,
   última linha = prazos de tarefa. O fundo atravessa tudo. */
.cal-sem{ display:grid; grid-template-columns: repeat(7,1fr); }

.cal-bg{
  min-height: 94px;
  border-right: 1px solid var(--borda);
  border-bottom: 1px solid var(--borda);
}
.cal-bg.ultima{ border-right:none; }
.cal-sem:last-child .cal-bg{ border-bottom:none; }
.cal-bg.fds{ background: color-mix(in oklab, var(--sup-3) 60%, transparent); }
.cal-bg.fora{ background: var(--sup-2); }

.cal-num{ position:relative; z-index:1; min-width:0; padding: 6px 6px 3px; }
.cal-n{
  font-family: var(--mono); font-size: 12px; color: var(--tinta-2);
  width: 24px; height: 24px; border-radius: 50%;
  display:grid; place-items:center;
}
.cal-num.fora .cal-n{ color: var(--tinta-3); opacity:.55; }
.cal-num.hoje .cal-n{ background: var(--acento); color:#fff; font-weight:500; }

/* a barra contínua */
.cal-barra{
  position:relative; z-index:1;
  margin: 1px 0 2px; padding: 3px 9px;
  min-width:0; text-align:left; overflow:hidden;
  font-size: 11px; font-weight:650; line-height:1.35;
  background: color-mix(in oklab, var(--ce) 17%, white);
  color: var(--ce-txt);
  transition: filter .18s var(--suave), transform .2s var(--mola);
}
.cal-barra span{ display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cal-barra:hover{ filter: brightness(.97); transform: translateY(-1px); }
.cal-barra.abre{
  border-top-left-radius: 7px; border-bottom-left-radius: 7px;
  margin-left: 4px; box-shadow: inset 3px 0 0 0 var(--ce);
}
.cal-barra.fecha{ border-top-right-radius: 7px; border-bottom-right-radius: 7px; margin-right: 4px; }
.cal-barra:not(.abre){ padding-left: 7px; }
.cal-barra:not(.abre)::before{
  content:"‹"; position:absolute; left:2px; top:50%; transform:translateY(-52%);
  font-size:12px; opacity:.55;
}
.cal-barra:not(.fecha)::after{
  content:"›"; position:absolute; right:3px; top:50%; transform:translateY(-52%);
  font-size:12px; opacity:.55;
}
.cal-barra:not(.fecha) span{ padding-right: 9px; }

.cal-tar{
  position:relative; z-index:1; min-width:0;
  padding: 2px 4px 6px; display:flex; flex-direction:column; gap:3px;
}
.cal-chip{
  display:flex; align-items:center; gap:5px; width:100%; text-align:left;
  padding: 3px 6px; border-radius: 7px; min-width:0;
  font-size: 11px; font-weight:500; line-height:1.3;
  color: var(--tinta-2); box-shadow: inset 0 0 0 1px var(--borda);
  transition: background .16s var(--suave);
}
.cal-chip:hover{ background: var(--sup-3); }
.cal-chip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cal-chip::before{ content:""; width:5px; height:5px; border-radius:50%; background: var(--ce); flex:none; }
.cal-chip.feita{ opacity:.5; }
.cal-chip.feita span{ text-decoration: line-through; }
.cal-mais{ font-size: 10.5px; color: var(--tinta-3); padding-left: 4px; }

.cal-legenda{ display:flex; align-items:center; gap:16px; margin-top: 12px; flex-wrap:wrap; }
.cal-lg{ display:flex; align-items:center; gap:6px; font-size: 11.5px; color: var(--tinta-2); }
.cal-lg i{ width:22px; height:9px; border-radius:4px; display:block;
            background: color-mix(in oklab, var(--ce) 30%, white); box-shadow: inset 3px 0 0 0 var(--ce); }
.cal-lg.tarefa i{ width:7px; height:7px; border-radius:50%; background: var(--tinta-3); box-shadow:none; }

/* tarefas ligadas, dentro do entregável */
.gt{ display:flex; align-items:center; gap:10px; padding: 8px 0; width:100%; text-align:left; }
.gt + .gt{ border-top: 1px solid var(--borda); }
.gt-pt{ width:8px; height:8px; border-radius:50%; background: var(--cf); flex:none; }
.gt-t{ flex:1; min-width:0; font-size: 13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gt:hover .gt-t{ color: var(--acento-texto); }
.gt.feita .gt-t{ color: var(--tinta-3); text-decoration: line-through; }
.gt-d{ font-family: var(--mono); font-size: 11.5px; color: var(--tinta-2); flex:none; }

/* ---- revisor --------------------------------------------- */
.rev-av{ position:relative; display:inline-flex; }
.rev-av::after{
  content:""; position:absolute; inset:-3px; border-radius:50%;
  box-shadow: 0 0 0 1.5px #9B4DFF;
}
.rev-l{ display:flex; align-items:center; gap:9px; font-size:13px; }
.rev-l b{ font-weight:650; }

/* ---- descrição ------------------------------------------- */
.ct-desc{
  font-size: 12px; color: var(--tinta-2); line-height:1.45; margin-top: 6px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.f-desc{ font-size: 13.5px; line-height:1.55; color: var(--tinta-2); }

/* O cartao inteiro e o botao: clicar em qualquer lugar da moldura
   abre a tarefa, e ele continua arrastavel. */
.ct{
  display:block; user-select:none; -webkit-user-select:none;
  background: var(--sup); border-radius: var(--r-m); padding: 12px 13px 11px;
  box-shadow: var(--s-1); cursor:grab; text-align:left; width:100%;
  transition: box-shadow .24s var(--suave), transform .24s var(--mola);
}
.ct:active{ cursor:grabbing; }
.ct-t{ display:block; overflow-wrap:anywhere; }
.ct:hover .ct-t{ color: var(--acento-texto); }
.ct:hover{ box-shadow: var(--s-2); transform: translateY(-2px); }
.ct.pegando{ opacity:.35; transform: scale(.97) rotate(1.4deg); cursor:grabbing; }
.ct-t{ font-size: 13.5px; font-weight:600; line-height:1.4; }
.ct-pe{ display:flex; align-items:center; gap:5px; margin-top: 9px; flex-wrap:wrap; }
.ct-m{ display:flex; align-items:center; gap:8px; margin-top: 9px; }
.ct-avs{ margin-left:auto; display:flex; align-items:center; gap:6px; }
.mini svg{ display:block; }
.ct-d{ font-family: var(--mono); font-size: 11px; color: var(--tinta-3); }
.ct-d.perto{ color: var(--alerta); font-weight:500; }
.ct-d.venceu{ color: var(--erro); font-weight:500; }
.ct-m .av{ margin-left:auto; }
.mini{
  display:inline-flex; align-items:center; gap:4px;
  font-family: var(--mono); font-size:10.5px; color: var(--tinta-3);
  background: var(--sup-3); padding:1px 6px; border-radius:20px;
}
.col-vazia{ padding: 14px 8px; font-size:12.5px; color: var(--tinta-3); text-align:center; }

/* lista */
.lista{ background: var(--sup); border-radius: var(--r-g); box-shadow: var(--s-1); overflow:hidden; }
.lg{
  --cc:#9295A8; --ct:var(--tinta-2); --cw:var(--sup-3);
  display:flex; align-items:center; gap:10px; padding: 12px 18px 11px;
  border-top:1px solid var(--borda); background: var(--cw);
}
.lg:first-child{ border-top:none; }

function prazoTxt(t){
  if(t.s === 'feito') return 'feito';
  if(t.d === 0) return 'hoje';
  if(t.d === 1) return 'amanhã';
  if(t.d === -1) return 'ontem';
  if(t.d < 0) return (-t.d)+'d atrás';
  if(t.d <= 6) return 'em '+t.d+'d';
  return fmt(t.d);
}
function prazoCls(t){
  if(t.s === 'feito') return '';
  if(t.d < 0) return 'venceu';

}
function horaTxt(h){
  if(h < 1) return 'agora';
  if(h < 24) return Math.round(h)+'h';
  var d = Math.round(h/24);
  return d === 1 ? 'ontem' : d+'d';
}

/* ---------- entregáveis ---------- */
function entregasDe(pid){
  return ENTREGAS.filter(function(g){ return g.p === pid; })
                 .sort(function(a,b){ return a.fim - b.fim || a.ini - b.ini; });
}
function duracaoEntrega(g){ return g.fim - g.ini + 1; }
function entrega(id){ for(var i=0;i<ENTREGAS.length;i++){ if(ENTREGAS[i].id===id) return ENTREGAS[i]; } return null; }
function tarefasDaEntrega(gid){ return TAREFAS.filter(function(t){ return t.ent === gid; }); }

/* Atrasado é derivado da data, nunca digitado. */
function sitEntrega(g){
  if(g.s === 'entregue') return 'entregue';
  if(g.fim < 0) return 'atrasado';
  return g.s;
}

/* A pista é decidida uma vez para o mês inteiro, não semana a semana.
   Assim a mesma entrega fica sempre na mesma altura e a barra não
   pula de linha ao virar a semana. */
function pistasDoMes(gs, ini, fim){
  var mapa = {};
  var vis = gs.filter(function(g){ return g.ini <= fim && g.fim >= ini; })
              .sort(function(a,b){ return a.ini - b.ini || a.fim - b.fim; });
  var pistas = [];
  vis.forEach(function(g){
    var L = 0;
    for(;;){
      var livre = !pistas[L] || pistas[L].every(function(o){
        return g.ini > o.fim || o.ini > g.fim;
      });
      if(livre){ (pistas[L] = pistas[L] || []).push(g); mapa[g.id] = L; break; }
      L++;
    }
  });
  return mapa;
}

/* Recorta, para uma semana, o pedaço visível de cada entregável. */
function faixasDaSemana(gs, ini, fim, mapaPistas){
  var segs = [], maxPista = -1;
  gs.forEach(function(g){
    var a = Math.max(g.ini, ini), b = Math.min(g.fim, fim);
    if(a > b) return;
    var pista = mapaPistas[g.id] || 0;
    if(pista > maxPista) maxPista = pista;
    segs.push({ g:g, col: a - ini + 1, span: b - a + 1, pista: pista,
                abre: g.ini >= ini, fecha: g.fim <= fim });
  });
  return { segs: segs, pistas: maxPista + 1 };
}
/* Dois tons, sempre: o vivo pinta, o fundo escreve. Texto sobre o
   tom vivo reprovava em AA (menta dava 1,96). */
function corEntrega(g){
  var st = sitEntrega(g);
  if(st === 'entregue') return '#00A86B';
  if(st === 'atrasado') return '#C4162E';
  if(st === 'curso')    return tomDoProjeto(g.p).c;
  return '#9295A8';
}
function corEntregaTexto(g){
  var st = sitEntrega(g);
  if(st === 'entregue') return '#00744A';
  if(st === 'atrasado') return '#A81026';
  if(st === 'curso')    return tomDoProjeto(g.p).cd;
  return '#61637A';
}
function progressoEntrega(gid){
  var ts = tarefasDaEntrega(gid);
  var f = ts.filter(function(t){ return t.s === 'feito'; }).length;
  return { feitas:f, total:ts.length, pct: ts.length ? Math.round(f/ts.length*100) : 0 };
}

  }).join('');

  /* 2 — vencimentos: tira de 7 dias */
  var abertas = TAREFAS.filter(function(t){ return t.s !== 'feito'; });
  var na7 = abertas.filter(function(t){ return t.d >= 0 && t.d <= 6; });
  var dias = [];
  for(var i=0;i<7;i++){
    var q = abertas.filter(function(t){ return t.d === i; }).length;

  /* 3 — em dia: um segmento por tarefa aberta */
  var atrasadas = abertas.filter(function(t){ return t.d < 0; }).length;
  var pct = abertas.length ? Math.round((abertas.length-atrasadas)/abertas.length*100) : 100;
  var segs = abertas.slice().sort(function(a,b){ return a.d-b.d; }).map(function(t,i){
    return '<span class="'+(t.d<0?'off':'on')+'" style="--i:'+i+'"></span>';

  return '<div class="resumo">'+
    '<div class="rc" style="--i:0"><div class="rc-t"><span class="rc-n">'+ativ.length+'</span>'+
      '<span class="rc-r">projetos ativos</span></div>'+

    '<div class="rc" style="--i:2"><div class="rc-t"><span class="rc-n">'+pct+'%</span>'+
      '<span class="rc-r">das tarefas no prazo</span></div>'+

  '</div>';

      '<span class="at-txt"><b>'+esc(q ? q.nome.split(' ')[0] : 'alguém')+'</b> '+f.v+' <span class="at-alvo">'+esc(t.t)+'</span>'+
      '<span class="at-pe"><span class="selo" style="--c:'+tom.c+';--cd:'+tom.cd+'">'+esc(p.nome)+'</span>'+
      '<span class="at-h">'+horaTxt(horasDesde(f.criado_em))+'</span></span></span>'+
    '</button></li>';
  }).join('');

  /* painel de prazos */
  var pzs = TAREFAS.filter(function(t){ return t.s !== 'feito'; })
    .sort(function(a,b){ return a.d-b.d; }).slice(0,8).map(function(t){
      var p = projeto(t.p), e = espaco(p.esp), tom = TONS[e.tom];
      return '<li><button class="pz" data-a="tarefa" data-id="'+t.id+'">'+
        '<span class="pz-b" style="--c:'+tom.c+'"></span>'+
        '<span class="pz-c"><span class="pz-t">'+esc(t.t)+'</span>'+
        '<span class="pz-s">'+esc(e.nome)+' · '+esc(p.nome)+'</span></span>'+
        '<span class="pz-q">'+pilha((t.qs||[]).map(pessoa).filter(Boolean),'p')+'</span>'+
        '<span class="pz-d '+prazoCls(t)+'">'+prazoTxt(t)+'</span>'+
      '</button></li>';
    }).join('');

  var hoje = HOJE;
  return '<div class="cab-vista" style="--i:0">'+
      '<div><h1>Bom dia, '+esc(eu().nome.split(' ')[0])+'</h1>'+
      '<p>'+DIA3[hoje.getDay()]+', '+hoje.getDate()+' de '+MES[hoje.getMonth()]+' · '+
      TAREFAS.filter(function(t){ return (t.qs||[]).indexOf(eu().id)>-1 && t.s!=='feito'; }).length+' tarefas suas em aberto</p></div>'+
    '</div>'+
    '<div style="--i:1">'+vResumo()+'</div>'+
    '<div class="paineis" style="--i:2">'+
      '<section class="painel"><div class="painel-cab"><h2>Atualizações</h2>'+
        '<span class="cont">'+FEED.length+'</span></div>'+
        '<div class="painel-corpo"><ul>'+(ats||'<li class="vazio-p">Nada por aqui ainda.</li>')+'</ul></div></section>'+
      '<section class="painel"><div class="painel-cab"><h2>Próximos prazos</h2>'+
        '<span class="cont">'+TAREFAS.filter(function(t){return t.s!=='feito';}).length+'</span></div>'+
        '<div class="painel-corpo"><ul>'+(pzs||'<li class="vazio-p">Nenhum prazo em aberto.</li>')+'</ul></div></section>'+
    '</div>';
}

        '<span class="pc-pct">'+pg.feitas+'/'+pg.total+'</span></span>'+
      '<span class="pc-l"><span class="pc-prazo">'+(p.prazo>=0?'entrega '+fmt(p.prazo):'encerrado')+'</span>'+

        '<div class="en"><span class="en-n">'+proj.length+'</span><span class="en-r">projetos</span></div>'+
        '<div class="en"><span class="en-n">'+abertas.length+'</span><span class="en-r">tarefas em aberto</span></div>'+
        '<div class="en"><span class="en-n"'+(atrasadas?' style="color:var(--erro)"':'')+'>'+atrasadas+'</span><span class="en-r">atrasadas</span></div>'+
        '<div class="en"><span class="en-n">'+equipeDoEspaco(e.id).length+'</span><span class="en-r">pessoas</span></div>'+
      '</div>'+
    '</div>'+
    '<div style="--i:1"><div class="grade">'+
      (cartoes || '<p class="vazio-p">Nenhum projeto neste espaço ainda.</p>')+'</div></div>';
}

function equipeDoEspaco(eid){
  var v={}, o=[];
  TAREFAS.forEach(function(t){
    var p = projeto(t.p);
    if(!p || p.esp!==eid) return;
    (t.qs||[]).forEach(function(id){ if(!v[id]){ v[id]=1; o.push(pessoa(id)); } });
  });
  return o.filter(Boolean);
}

var COLUNAS = [

function vEtiquetas(t){
  var e = '';
  var sp = t.spr ? sprint(t.spr) : null;
  if(sp) e += '<span class="spr" title="Criada na Sprint '+sp.n+' · '+faixaSprint(sp)+'">S'+sp.n+'</span>';
  if(t.subs && t.subs.length){
    e += '<span class="mini">'+t.subs.filter(function(x){ return x.ok; }).length+'/'+t.subs.length+'</span>';
  }
  if(t.anexos && t.anexos.length){
    e += '<span class="mini" title="'+t.anexos.length+' anexo(s)">'+I.clipe+t.anexos.length+'</span>';
  }
  if(t.desc) e += '<span class="mini" title="Tem descrição">'+I.linhas+'</span>';
  if(bloqueada(t)) e += '<span class="mini" style="color:var(--erro);background:var(--erro-bg)">bloqueada</span>';
  else if(t.rep) e += '<span class="mini">'+t.rep+'</span>';

function vCartaoTarefa(t, i){

function vLinhaTarefa(t){
  var avs = pilha((t.qs||[]).map(pessoa).filter(Boolean),'p');

function vBacklogCal(pid){
  var ref = mesRef();
  var primeiro = new Date(ref.getFullYear(), ref.getMonth(), 1);
  var inicio = new Date(primeiro);
  inicio.setDate(1 - primeiro.getDay());          /* recua até o domingo */

  var gs = entregasDe(pid);
  var ts = tarefasDe(pid);
  var semanas = [];

  var offJanela = offDeData(inicio);
  var mapaPistas = pistasDoMes(gs, offJanela, offJanela + 41);

  for(var w = 0; w < 6; w++){
    var d0 = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + w*7);
    /* Meses que cabem em cinco semanas não ganham uma faixa cinza vazia. */
    if(w === 5 && d0.getMonth() !== ref.getMonth()) break;
    var offIni = offDeData(d0), offFim = offIni + 6;
    var faixas = faixasDaSemana(gs, offIni, offFim, mapaPistas);
    var nPistas = faixas.pistas;
    var linhaTarefas = nPistas + 2;
    var totalLinhas  = linhaTarefas;

    var partes = [];

    /* fundos, atravessando todas as linhas da semana */
    for(var c = 0; c < 7; c++){
      var dc = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + c);
      var fora = dc.getMonth() !== ref.getMonth();
      var fds = dc.getDay() === 0 || dc.getDay() === 6;
      partes.push('<div class="cal-bg'+(fora?' fora':'')+(fds?' fds':'')+(c===6?' ultima':'')+'"'+
        ' style="grid-column:'+(c+1)+';grid-row:1 / span '+totalLinhas+'"></div>');
    }

    /* números do dia */
    for(var c2 = 0; c2 < 7; c2++){
      var dn = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + c2);
      var foraN = dn.getMonth() !== ref.getMonth();
      var hoje = offDeData(dn) === 0;
      partes.push('<div class="cal-num'+(foraN?' fora':'')+(hoje?' hoje':'')+'"'+
        ' style="grid-column:'+(c2+1)+';grid-row:1"><span class="cal-n">'+dn.getDate()+'</span></div>');
    }

    /* barras contínuas */
    faixas.segs.forEach(function(seg){
      var g = seg.g;
      partes.push('<button type="button" class="cal-barra'+(seg.abre?' abre':'')+(seg.fecha?' fecha':'')+'"'+
        ' data-a="entrega" data-id="'+g.id+'"'+
        ' style="--ce:'+corEntrega(g)+';--ce-txt:'+corEntregaTexto(g)+
          ';grid-column:'+seg.col+' / span '+seg.span+';grid-row:'+(seg.pista+2)+'"'+
        ' title="'+esc(g.nome)+' · '+fmt(g.ini)+' a '+fmt(g.fim)+'">'+
        '<span>'+esc(g.nome)+'</span></button>');
    });

    /* prazos de tarefa, sempre na última linha */
    for(var c3 = 0; c3 < 7; c3++){
      var dt = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + c3);
      var offT = offDeData(dt);
      var doDia = ts.filter(function(t){ return t.d === offT; });
      var mostra = doDia.slice(0, 2);
      var resto = doDia.length - mostra.length;
      partes.push('<div class="cal-tar" style="grid-column:'+(c3+1)+';grid-row:'+linhaTarefas+'">'+
        mostra.map(function(t){
          return '<button type="button" class="cal-chip'+(t.s==='feito'?' feita':'')+'"'+
            ' data-a="tarefa" data-id="'+t.id+'" style="--ce:'+COR_FASE[t.s]+'"'+
            ' title="Tarefa · '+esc(t.t)+'"><span>'+esc(t.t)+'</span></button>';
        }).join('')+
        (resto > 0 ? '<span class="cal-mais">+'+resto+'</span>' : '')+
      '</div>');
    }

    semanas.push('<div class="cal-sem">'+partes.join('')+'</div>');
  }

  var dows = ['dom','seg','ter','qua','qui','sex','sáb']
    .map(function(x){ return '<span>'+x+'</span>'; }).join('');

  return '<div class="cal-cab">'+
      '<span class="cal-mes">'+MES_LONGO[ref.getMonth()]+'</span>'+
      '<span class="cal-ano">'+ref.getFullYear()+'</span>'+
      '<span class="cal-nav">'+
        (E.mesCal !== 0 ? '<button class="b b-s b-pq" data-a="mes-hoje">Hoje</button>' : '')+
        '<button class="b b-s b-i" data-a="mes-anda" data-v="-1" aria-label="Mês anterior">'+I.esq+'</button>'+
        '<button class="b b-s b-i" data-a="mes-anda" data-v="1" aria-label="Próximo mês">'+I.dir+'</button>'+
      '</span>'+
    '</div>'+
    '<div class="cal"><div class="cal-dow">'+dows+'</div>'+ semanas.join('') +'</div>'+
    '<div class="cal-legenda">'+
      '<span class="cal-lg" style="--ce:'+tomDoProjeto(pid).c+'"><i></i> Período do entregável</span>'+
      '<span class="cal-lg tarefa"><i></i> Prazo de tarefa</span>'+
      '<span class="cal-lg" style="--ce:#00A86B"><i></i> Entregue</span>'+
      '<span class="cal-lg" style="--ce:#C4162E"><i></i> Atrasado</span>'+
    '</div>';
}

      if(!lista.length) return '';
      return '<div class="lg lg-'+g[0]+'"><span class="lg-pt"></span><h3>'+g[1]+'</h3>'+

  var chipSprint = spAgora
    ? '<button class="sprint-b" data-a="sprints" data-id="'+p.id+'">'+I.cal+
        ' Sprint '+spAgora.n+' <span class="mono">'+faixaSprint(spAgora)+'</span></button>'
    : '<button class="sprint-b" data-a="sprints" data-id="'+p.id+'">'+I.cal+
        (spTodas.length ? ' Nenhuma sprint em curso' : ' Definir sprints')+'</button>';

  return '<div class="cab-vista" style="--i:0">'+
      '<div><h1>'+esc(p.nome)+'</h1>'+
      '<p>'+esc(p.desc)+' · <span class="sit '+SIT_CLS[sit]+'" style="vertical-align:1px">'+SIT_TXT[sit]+'</span></p></div>'+
      '<div class="dir">'+
        (eu().admin ? '<button class="b-i b b-s" data-a="editar-projeto" data-id="'+p.id+'" aria-label="Editar projeto" style="margin-right:8px">'+I.lapis+'</button>' : '')+
        '<div class="seg" role="tablist">'+
          '<span class="seg-p"></span>'+
          '<button role="tab" data-a="vista" data-id="quadro" aria-selected="'+(E.vistaProjeto==='quadro')+'">Quadro</button>'+
          '<button role="tab" data-a="vista" data-id="lista" aria-selected="'+(E.vistaProjeto==='lista')+'">Lista</button>'+
          '<button role="tab" data-a="vista" data-id="backlog" aria-selected="'+(E.vistaProjeto==='backlog')+'">Backlog</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div style="--i:1;display:flex;gap:22px;align-items:center;margin-bottom:22px;flex-wrap:wrap">'+
      chipSprint+
      '<div style="display:flex;align-items:center;gap:11px;min-width:190px">'+
        '<span class="trilho" style="--c:'+tom.c+'"><i style="width:'+pg.pct+'%"></i></span>'+
        '<span class="pc-pct">'+pg.feitas+'/'+pg.total+'</span></div>'+
      '<div class="en"><span class="en-r">Entrega</span><span class="mono" style="font-size:13px;font-weight:600">'+(p.prazo>=0?fmt(p.prazo):'encerrado')+'</span></div>'+
      '<div class="en"><span class="en-r">Equipe</span>'+pilha(equipeDo(p.id),'p')+'</div>'+
    '</div>'+
    '<div style="--i:2">'+corpo+'</div>';

/* ==========================================================
   MODAIS
   ========================================================== */

function isoDe(o){ var d=dataDe(o); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function offDe(iso){ var q=iso.split('-'); var d=new Date(+q[0],+q[1]-1,+q[2]); d.setHours(0,0,0,0); return Math.round((d-HOJE)/86400000); }

/* "Há quantas horas" a partir de um timestamp real do banco — o
   mesmo papel que offDe() cumpre para datas, mas para os "h" de
   comentário e atividade, que agora vêm de criado_em de verdade
   em vez de um número gravado na hora. */
function horasDesde(iso){
  return Math.max(0, (Date.now() - new Date(iso).getTime()) / 3600000);
}

/* multi:true faz de "sel" um array — cada clique alterna a pessoa
   dentro dele, em vez de substituir a escolha inteira. */
function chipsQuem(sel, acao, multi){
  return '<div class="quem">'+EQUIPE.map(function(p){
    var marcado = multi ? (sel||[]).indexOf(p.id)>-1 : sel===p.id;
    return '<button class="qb" data-a="'+acao+'" data-id="'+p.id+'" aria-pressed="'+marcado+'">'+
      av(p,'p')+esc(p.nome.split(' ')[0])+(p.fora?' <span class="fora">fora</span>':'')+'</button>';
  }).join('')+'</div>';
}

function vModalTarefa(t){
  var p = projeto(t.p), e = espaco(p.esp), tom = TONS[e.tom];
  var sp = t.spr ? sprint(t.spr) : null;

  var subs = (t.subs||[]).map(function(x,i){
    return '<div class="sub'+(x.ok?' ok':'')+'">'+
      '<button class="tick" data-a="sub" data-id="'+t.id+'" data-i="'+i+'" data-rid="'+x.id+'" aria-pressed="'+x.ok+'" aria-label="'+esc(x.t)+'">'+I.tique+'</button>'+
      '<span>'+esc(x.t)+'</span></div>';
  }).join('') || '<p style="font-size:13px;color:var(--tinta-3)">Sem subtarefas.</p>';

  var anexos = (t.anexos||[]).map(function(a,i){ return vAnexo(a,i,t.id); }).join('')
    || '<p style="font-size:13px;color:var(--tinta-3)">Nenhum documento anexado.</p>';

  var cms = (t.coments||[]).map(function(c){
    var q = pessoa(c.q);
    return '<div class="cm">'+av(q,'')+'<div class="cm-c">'+
      '<div class="cm-q"><b>'+esc(q ? q.nome.split(' ')[0] : 'alguém')+'</b> · '+horaTxt(horasDesde(c.criado_em))+'</div>'+
      '<div class="cm-t">'+esc(c.t)+'</div></div></div>';
  }).join('') || '<p style="font-size:13px;color:var(--tinta-3)">Nenhum comentário ainda.</p>';

  var opDep = TAREFAS.filter(function(x){ return x.p===t.p && x.id!==t.id; })
    .map(function(x){ return '<option value="'+x.id+'"'+(t.dep===x.id?' selected':'')+'>'+esc(x.t)+'</option>'; }).join('');

  var trava = bloqueada(t)
    ? '<p style="margin-top:10px"><span class="sit s-erro">aguarda: '+esc(tarefa(t.dep).t)+'</span></p>' : '';

  var linhaRevisor = t.s === 'revisao' && t.revisor
    ? '<div class="campo"><label>Em revisão por</label><div class="rev-l">'+
        '<span class="rev-av">'+av(pessoa(t.revisor),'')+'</span><b>'+esc(nomeDe(t.revisor))+'</b>'+
        '<button class="b b-f b-pq" data-a="pedir-revisor" data-id="'+t.id+'" style="margin-left:auto">Trocar</button>'+
      '</div></div>'
    : '';

  return '<div class="folha larga" role="dialog" aria-modal="true" aria-label="'+esc(t.t)+'">'+
    '<div class="f-cab"><div>'+
      '<span class="selo" style="--c:'+tom.c+';--cd:'+tom.cd+'">'+esc(e.nome)+' · '+esc(p.nome)+'</span>'+
      (sp ? ' <span class="spr" title="Criada nesta sprint">'+I.cal+' Sprint '+sp.n+' · '+faixaSprint(sp)+'</span>' : '')+
      '<input class="ent" data-campo="t" data-id="'+t.id+'" value="'+esc(t.t)+'" aria-label="Título da tarefa"'+
        ' style="margin-top:10px;font-size:19px;font-weight:800;letter-spacing:-.028em;padding:6px 10px">'+trava+'</div>'+
      '<button class="f-x" data-a="fechar" aria-label="Fechar">'+I.x+'</button></div>'+
    '<div class="f-corpo">'+

      '<div class="campo"><label>Situação</label><div class="opcoes">'+
        COLUNAS.map(function(c){
          var acao = c[0] === 'revisao' ? 'pedir-revisor' : 'situacao';
          return '<button class="op" data-a="'+acao+'" data-id="'+t.id+'" data-v="'+c[0]+'" aria-pressed="'+(t.s===c[0])+'">'+c[1]+'</button>';
        }).join('')+'</div>'+
        '<span class="f-dica">A fase muda aqui, ou arrastando o cartão no quadro. Não há outro caminho.</span></div>'+

      linhaRevisor +

      '<div class="campo"><label>Responsáveis</label>'+chipsQuem(t.qs,'quem-tarefa',true)+
        '<input type="hidden" id="mt-id" value="'+t.id+'"></div>'+

      '<div class="campo"><label for="mt-d">Prazo</label>'+
        '<input class="ent" id="mt-d" type="date" value="'+isoDe(t.d)+'" data-campo="d" data-id="'+t.id+'"></div>'+

      '<div class="campo"><label for="mt-ent">Entregável</label>'+
        '<select class="ent" id="mt-ent" data-campo="ent" data-id="'+t.id+'">'+
        opcoesEntrega(t.p, t.ent || null)+'</select></div>'+
      '<div class="campo"><label for="mt-desc">Descrição</label>'+
        '<textarea class="ent" id="mt-desc" data-campo="desc" data-id="'+t.id+'"'+
        ' placeholder="Complemente a explicação: o que precisa sair daqui, e o que já foi combinado">'+esc(t.desc||'')+'</textarea></div>'+

      '<div class="bloco"><span class="rot">Subtarefas</span>'+subs+'</div>'+

      '<div class="bloco"><span class="rot">Documentos</span>'+anexos+
        '<div class="anx-add">'+
          '<input class="ent" id="an-url" placeholder="Cole o link do documento" autocomplete="off" style="flex:2">'+
          '<input class="ent" id="an-nome" placeholder="Nome (opcional)" autocomplete="off" style="flex:1">'+
          '<button class="b b-s" data-a="add-anexo" data-id="'+t.id+'">Anexar</button>'+
        '</div>'+
        '<p style="font-size:11.5px;color:var(--tinta-3);margin-top:7px">O tipo é reconhecido pelo link: planilha, documento, apresentação ou PDF.</p>'+
        '<div class="drive-fut">'+I.drive+' <b>Google Drive</b> — anexar direto da sua conta'+
          '<span class="marca-fut">em breve</span></div>'+
      '</div>'+

      '<div class="bloco"><span class="rot">Comentários</span>'+cms+
        '<div class="campo" style="margin-top:13px"><label class="so-leitor" for="mt-c">Novo comentário</label>'+
        '<textarea class="ent" id="mt-c" placeholder="Escreva o que a equipe precisa saber"></textarea></div>'+
        '<button class="b b-s b-pq" data-a="comentar" data-id="'+t.id+'">Comentar</button></div>'+

      '<details class="av-mais"'+((t.rep||t.dep)?' open':'')+'><summary>'+I.chev+'Recorrência e dependência</summary>'+
        '<div class="av-i"><div class="dupla">'+
          '<div class="campo"><label for="mt-r">Repete</label><select class="ent" id="mt-r" data-campo="rep" data-id="'+t.id+'">'+
            '<option value="">não repete</option>'+
            '<option value="semanal"'+(t.rep==='semanal'?' selected':'')+'>toda semana</option>'+
            '<option value="mensal"'+(t.rep==='mensal'?' selected':'')+'>todo mês</option></select></div>'+
          '<div class="campo"><label for="mt-dep">Depende de</label><select class="ent" id="mt-dep" data-campo="dep" data-id="'+t.id+'">'+
            '<option value="">nada</option>'+opDep+'</select></div>'+
        '</div></div></details>'+
    '</div>'+
    (E.confirmandoExclusao === t.id
      ? '<div class="f-pe confirmando">'+
          '<span class="f-conf">Apagar esta tarefa de vez? Não dá para desfazer.</span>'+
          '<button class="b b-f" data-a="cancelar-excluir">Cancelar</button>'+
          '<button class="b b-perigo-solido" data-a="excluir" data-id="'+t.id+'">Apagar</button>'+
        '</div>'
      : '<div class="f-pe">'+
          '<button class="b b-perigo" data-a="pedir-excluir" data-id="'+t.id+'">'+I.lixo+' Apagar tarefa</button>'+
          '<button class="b b-p" data-a="fechar">Fechar</button>'+
        '</div>')+
  '</div>';
}

/* Sprints: a equipe escolhe as datas no calendário. */
function vModalSprints(){
  var pid = E.modal.id, p = projeto(pid), l = sprintsDe(pid), agora = sprintAtual(pid);

  var lista = l.map(function(x){
    var atual = agora && agora.id === x.id;

    /* Em edicao a linha vira formulario, no proprio lugar. */
    if(E.editandoSprint === x.id){
      return '<div class="spl editando">'+
        '<span class="spl-n">Sprint '+x.n+'</span>'+
        '<input class="ent" id="ed-i-'+x.id+'" type="date" value="'+isoDe(x.ini)+'" aria-label="Início da Sprint '+x.n+'">'+
        '<span class="spl-ate">até</span>'+
        '<input class="ent" id="ed-f-'+x.id+'" type="date" value="'+isoDe(x.fim)+'" aria-label="Fim da Sprint '+x.n+'">'+
        '<span class="spl-acoes">'+
          '<button class="b b-f b-pq" data-a="cancelar-sprint">Cancelar</button>'+
          '<button class="b b-p b-pq" data-a="salvar-sprint" data-id="'+x.id+'">Salvar</button>'+
        '</span>'+
        (E.erroEdicao ? '<span class="spl-erro">'+esc(E.erroEdicao)+'</span>' : '')+
      '</div>';
    }

    return '<button type="button" class="spl'+(atual ? ' agora' : '')+'"'+
      ' data-a="editar-sprint" data-id="'+x.id+'" aria-label="Alterar datas da Sprint '+x.n+'">'+
      '<span class="spl-n">Sprint '+x.n+'</span>'+
      '<span class="spl-d">'+faixaSprint(x)+'</span>'+
      (atual ? '<span class="sit s-ok">em curso</span>' : '')+
      '<span class="spl-q">'+tarefasNaSprint(x.id)+(tarefasNaSprint(x.id)===1?' tarefa':' tarefas')+'</span>'+
      '<span class="spl-ed">'+I.lapis+'</span>'+
    '</button>';
  }).join('') || '<p style="font-size:13px;color:var(--tinta-3)">Nenhuma sprint definida ainda.</p>';

  var prox = l.length ? l[l.length-1].fim + 1 : 0;

  return '<div class="folha" role="dialog" aria-modal="true" aria-label="Sprints do projeto">'+
    '<div class="f-cab"><div><h2>Sprints</h2>'+
      '<p>'+esc(p.nome)+'. Você escolhe as datas de início e fim de cada uma. '+
      'Clique numa sprint para corrigir as datas.</p></div>'+
      '<button class="f-x" data-a="fechar" aria-label="Fechar">'+I.x+'</button></div>'+
    '<div class="f-corpo">'+
      lista +
      '<div class="bloco"><span class="rot">Nova sprint</span>'+
        '<div class="dupla">'+
          '<div class="campo"><label for="sp-i">Começa em</label>'+
            '<input class="ent" id="sp-i" type="date" value="'+isoDe(prox)+'"></div>'+
          '<div class="campo"><label for="sp-f">Termina em</label>'+
            '<input class="ent" id="sp-f" type="date" value="'+isoDe(prox+13)+'"></div>'+
        '</div>'+
        (E.erroSprint
          ? '<p class="sit s-erro" style="display:flex">'+esc(E.erroSprint)+'</p>'
          : '<p style="font-size:11.5px;color:var(--tinta-3)">A tarefa criada dentro deste período fica marcada com esta sprint.</p>')+
      '</div>'+
    '</div>'+
    '<div class="f-pe"><button class="b b-f" data-a="fechar">Fechar</button>'+
      '<button class="b b-p" data-a="criar-sprint" data-id="'+pid+'">Criar sprint</button></div>'+
  '</div>';
}


/* ==========================================================
   Estes três modais foram apagados por engano num passo anterior

function opcoesEntrega(pid, sel){
  return '<option value="">— nenhum —</option>' + entregasDe(pid).map(function(g){
    return '<option value="'+g.id+'"'+(sel===g.id?' selected':'')+'>'+
      esc(g.nome)+' · entrega '+fmt(g.fim)+'</option>';
  }).join('');
}

  return '<div class="folha" role="dialog" aria-modal="true" aria-label="Nova tarefa">'+

/* Serve para criar E para editar — a diferença é só se
   E.modal.tipo é 'novo-projeto' ou 'editar-projeto'. Editar e
   apagar só aparecem no rodapé pra quem é admin (checado na hora
   de abrir o modal, não aqui — mas o campo continua condicional
   porque a mesma função desenha os dois casos). */
function vModalProjeto(){
  var editando = E.modal.tipo === 'editar-projeto';
  var p = editando ? projeto(E.modal.id) : null;
  var eidPadrao = editando ? p.esp : E.modal.id;

  var rodape;
  if(editando && E.confirmandoExclusao === p.id){
    rodape = '<div class="f-pe confirmando">'+
      '<span class="f-conf">Apagar este projeto de vez? Leva junto todas as tarefas, entregas e sprints dentro dele. Não dá pra desfazer.</span>'+
      '<button class="b b-f" data-a="cancelar-excluir">Cancelar</button>'+
      '<button class="b b-perigo-solido" data-a="excluir-projeto" data-id="'+p.id+'">Apagar</button></div>';
  } else {
    rodape = '<div class="f-pe">'+
      (editando ? '<button class="b b-perigo" data-a="pedir-excluir" data-id="'+p.id+'">'+I.lixo+' Apagar projeto</button>' : '')+
      '<button class="b b-f" data-a="fechar">Cancelar</button>'+
      '<button class="b b-p" data-a="salvar-projeto" data-id="'+(editando?p.id:'')+'">'+(editando?'Salvar':'Criar projeto')+'</button>'+
    '</div>';
  }

  return '<div class="folha" role="dialog" aria-modal="true" aria-label="'+(editando?'Editar projeto':'Novo projeto')+'">'+
    '<div class="f-cab"><div><h2>'+(editando?'Editar projeto':'Novo projeto')+'</h2>'+
      (editando ? '' : '<p>Ele nasce dentro de um Espaço e herda a cor dele.</p>')+'</div>'+
      '<button class="f-x" data-a="fechar" aria-label="Fechar">'+I.x+'</button></div>'+
    '<div class="f-corpo">'+
      '<div class="campo"><label for="np-n">Nome do projeto</label>'+
        '<input class="ent" id="np-n" placeholder="Ex: diagnóstico operacional" autocomplete="off"'+
        ' value="'+(editando?esc(p.nome):'')+'"></div>'+
      '<div class="campo"><label for="np-d">Uma linha sobre o que é</label>'+
        '<input class="ent" id="np-d" placeholder="Ex: mapear gargalos nas seis unidades" autocomplete="off"'+
        ' value="'+(editando?esc(p.desc):'')+'"></div>'+
      '<div class="dupla">'+
        '<div class="campo"><label for="np-e">Espaço</label><select class="ent" id="np-e">'+

        '</select></div>'+
        '<div class="campo"><label for="np-p">Entrega prevista</label>'+

      '</div>'+
      (E.erroCrud ? '<p class="sit s-erro" style="display:flex">'+esc(E.erroCrud)+'</p>' : '')+
    '</div>'+
    rodape+

}

/* Um modal só serve para criar e para corrigir: na edição os campos
   valem na hora, como na tarefa; na criação, só ao confirmar. */
function vModalEntrega(){
  var criando = E.modal.tipo === 'nova-entrega';
  var g = criando ? null : entrega(E.modal.id);
  var pid = criando ? E.modal.id : g.p;
  var pr = projeto(pid), e = espaco(pr.esp), tom = TONS[e.tom];

  var vNome  = criando ? '' : g.nome;
  var vDesc  = criando ? '' : (g.desc || '');
  var vIni = criando ? isoDe(0)  : isoDe(g.ini);
  var vFim = criando ? isoDe(21) : isoDe(g.fim);
  var vSit   = criando ? (E.novaEntSit  || 'planejado') : g.s;
  var vQuem  = criando ? (E.novaEntQuem || eu().id)     : g.q;
  var idA    = criando ? '' : ' data-id="'+g.id+'"';

  var sits = SIT_ENT.map(function(c){

function pinValido(v){ return /^[0-9]{6}$/.test(v); }

function traduzErroCadastro(msg){
  msg = String(msg || '');
  if(msg.indexOf('redesaoroque') > -1 || msg.indexOf('Database error') > -1){
    return 'Cadastro permitido só com e-mail @redesaoroque.com.br.';
  }
  if(msg.indexOf('already registered') > -1 || msg.indexOf('already exists') > -1){
    return 'Esse e-mail já tem conta. Tente entrar.';
  }
  return 'Não consegui criar a conta. Confira os dados e tente de novo.';
}

async function tentarEntrar(){
  if(!pinValido(E.authPin)) return;
  /* Lê o e-mail direto do DOM: o PIN pode disparar isto sozinho ao
     completar o 6º dígito, sem passar pelo clique do botão Entrar
     (que era o único lugar sincronizando E.authEmail antes). */
  var campoEmail = document.getElementById('au-email');
  if(campoEmail) E.authEmail = campoEmail.value.trim();
  if(!E.authEmail){ E.authErro = 'Falta o e-mail.'; render(); return; }
  E.authErro = ''; E.authCarregando = true; render();
  var r = await sb.auth.signInWithPassword({ email: E.authEmail, password: E.authPin });
  E.authCarregando = false;
  if(r.error){
    /* A mensagem que a pessoa vê fica simples, mas o erro de
       verdade vai pro console — sem isso, "PIN errado" e "muitas
       tentativas seguidas" ficam indistinguíveis na hora de depurar. */
    console.error('signInWithPassword:', r.error);
    E.authErro = (r.error.status === 429)
      ? 'Muitas tentativas seguidas. Espera um minuto e tenta de novo.'
      : 'E-mail ou PIN incorretos.';
    E.authPin = '';
    render();
    return;
  }
  // sucesso: onAuthStateChange autentica e renderiza
}

async function tentarCadastrar(){
  if(E.authPinConfirma !== E.authPinNovo){
    E.authErro = 'Os PINs não são iguais.';
    E.authPinNovo = ''; E.authPinConfirma = '';
    E.authPasso = 'pin';
    render();
    return;
  }
  E.authErro = ''; E.authCarregando = true; render();
  var r = await sb.auth.signUp({
    email: E.authEmail.trim(),
    password: E.authPinConfirma,
    options: { data: { nome: E.authNome.trim(), cor: E.authCor } }
  });
  E.authCarregando = false;
  if(r.error){
    console.error('signUp:', r.error);
    E.authErro = traduzErroCadastro(r.error.message);
    E.authPasso = 'dados';
    E.authPinNovo = ''; E.authPinConfirma = '';
    render();
    return;
  }
  // sucesso: onAuthStateChange autentica e renderiza
}

/* Logo depois do login, a sessão às vezes ainda não terminou de
   anexar o token na primeira leva de consultas — uma ou outra
   volta com 401 mesmo estando tudo certo. Sem nova tentativa, o
   array correspondente ficava vazio e o resto do app, que conta
   com ele já preenchido, travava tentando ler algo que sumiu. */
async function consultar(fabrica, tentativas){
  tentativas = tentativas || 2;
  var r;
  for(var i=0; i<tentativas; i++){
    r = await fabrica();
    if(!r.error) return r;
    if(i < tentativas-1) await new Promise(function(res){ setTimeout(res, 500); });
  }
  console.error('Consulta falhou mesmo tentando de novo:', r.error);
  return r;
}

/* Tarefas, e aninhado em cada uma: subtarefas, comentários e
   anexos — três tabelas à parte no banco, viram array dentro do
   objeto da tarefa aqui, do jeito que o resto do app já espera. */
async function carregarTarefas(){
  var rt = await consultar(function(){
    return sb.from('tarefas').select(
      'id, projeto_id, entrega_id, sprint_id, dependencia_id, titulo, descricao, revisor_id, prazo, situacao, recorrencia'
    );
  });
  if(!rt.data){ return; }

  var ids = rt.data.map(function(row){ return row.id; });
  var subsPorTarefa = {}, comsPorTarefa = {}, anxPorTarefa = {}, qsPorTarefa = {};

  if(ids.length){
    var rs = await sb.from('subtarefas').select('id, tarefa_id, titulo, concluida').in('tarefa_id', ids).order('ordem');
    (rs.data || []).forEach(function(row){
      (subsPorTarefa[row.tarefa_id] = subsPorTarefa[row.tarefa_id] || [])
        .push({ id: row.id, t: row.titulo, ok: row.concluida });
    });

    var rc = await sb.from('comentarios').select('id, tarefa_id, autor_id, texto, criado_em').in('tarefa_id', ids).order('criado_em');
    (rc.data || []).forEach(function(row){
      (comsPorTarefa[row.tarefa_id] = comsPorTarefa[row.tarefa_id] || [])
        .push({ id: row.id, q: row.autor_id, t: row.texto, criado_em: row.criado_em });
    });

    var ra = await sb.from('anexos').select('id, tarefa_id, tipo, nome, url').in('tarefa_id', ids);
    (ra.data || []).forEach(function(row){
      (anxPorTarefa[row.tarefa_id] = anxPorTarefa[row.tarefa_id] || [])
        .push({ id: row.id, tipo: row.tipo, nome: row.nome, url: row.url });
    });

    var rq = await sb.from('tarefas_responsaveis').select('tarefa_id, pessoa_id').in('tarefa_id', ids);
    (rq.data || []).forEach(function(row){
      (qsPorTarefa[row.tarefa_id] = qsPorTarefa[row.tarefa_id] || []).push(row.pessoa_id);
    });
  }

  TAREFAS.length = 0;
  rt.data.forEach(function(row){
    TAREFAS.push({
      id: row.id, p: row.projeto_id, ent: row.entrega_id, spr: row.sprint_id, dep: row.dependencia_id,
      t: row.titulo, desc: row.descricao || '', qs: qsPorTarefa[row.id] || [], revisor: row.revisor_id,
      d: offDe(row.prazo), s: row.situacao, rep: row.recorrencia,
      subs: subsPorTarefa[row.id] || [], coments: comsPorTarefa[row.id] || [], anexos: anxPorTarefa[row.id] || []
    });
  });
}

/* Caminho de render bem mais simples que o do app autenticado — sem
   lateral, sem tópico, sem preservar rolagem de tela nenhuma. Mas
   agora tem campos de texto de verdade (e-mail, nome), então
   precisa da mesma preservação de valor digitado que o app usa. */
function renderLogin(){
  var app = document.getElementById('app');

  if(!E.autPronto){ app.innerHTML = vCarregandoAuth(); return; }

  var digitado = {};
  [].forEach.call(app.querySelectorAll('input[id]'), function(el){ digitado[el.id] = el.value; });
  var focoId = document.activeElement ? document.activeElement.id : '';

  app.innerHTML = vLogin();
  aplicarTom();

  [].forEach.call(app.querySelectorAll('input[id]'), function(el){
    if(Object.prototype.hasOwnProperty.call(digitado, el.id)) el.value = digitado[el.id];
  });

  var alvo = (focoId && document.getElementById(focoId)) || app.querySelector('.login-card input');
  if(alvo) alvo.focus({ preventScroll:true });
}

function render(){
  if(!E.autenticado){ renderLogin(); return; }

  var app = document.getElementById('app');

  var digitado = {};
  [].forEach.call(app.querySelectorAll('input[id], select[id], textarea[id]'), function(el){ digitado[el.id] = el.value; });

  var rolagem = 0;
  var pr = app.querySelector('.principal');
  if(pr) rolagem = pr.scrollTop;
  var focoId = document.activeElement ? document.activeElement.id : '';

  var corpo;
  if(E.tela === 'espaco')       corpo = vEspaco();
  else if(E.tela === 'projeto') corpo = vProjeto();
  else                          corpo = vInicio();

  var vista = E.tela + ':' + (E.espacoAberto||'') + ':' + (E.projetoAberto||'') + ':' +
              E.vistaProjeto + ':' + E.vistaBacklog;
  var animar = vista !== vistaAnterior;
  vistaAnterior = vista;

  var html = vLateral() +
    '<main class="principal">' + vTopo() +
      '<div class="conteudo' + (animar ? ' animar' : '') + '">' + corpo + '</div>' +
    '</main>';

  if(E.modal){
    var m = '';
    if(E.modal.tipo === 'tarefa')       m = vModalTarefa(tarefa(E.modal.id));
    if(E.modal.tipo === 'nova-tarefa')  m = vModalNovaTarefa(E.modal.id, E.modal.col);
    if(E.modal.tipo === 'novo-projeto' || E.modal.tipo === 'editar-projeto') m = vModalProjeto();
    if(E.modal.tipo === 'novo-espaco'  || E.modal.tipo === 'editar-espaco')  m = vModalEspaco();
    if(E.modal.tipo === 'revisor')      m = vModalRevisor();
    if(E.modal.tipo === 'sprints')      m = vModalSprints();
    if(E.modal.tipo === 'entrega' ||
       E.modal.tipo === 'nova-entrega')  m = vModalEntrega();
    html += '<div class="veu" data-veu="1">' + m + '</div>';
  }

  app.innerHTML = html;
  aplicarTom();

  [].forEach.call(app.querySelectorAll('input[id], select[id], textarea[id]'), function(el){
    if(Object.prototype.hasOwnProperty.call(digitado, el.id)) el.value = digitado[el.id];
  });

  var pr2 = app.querySelector('.principal');
  if(pr2 && !animar) pr2.scrollTop = rolagem;
  if(pr2){
    pr2.addEventListener('scroll', function(){
      var t = pr2.querySelector('.topo');
      if(t) t.classList.toggle('colado', pr2.scrollTop > 4);
    }, { passive:true });
    var tp = pr2.querySelector('.topo');
    if(tp) tp.classList.toggle('colado', pr2.scrollTop > 4);
  }

  posicionarSeg();
  ligarArrasto();

  if(focoId && document.getElementById(focoId)){
    document.getElementById(focoId).focus({ preventScroll:true });
  } else if(E.editandoSprint){
    /* Entrou em edição, ou voltou de um erro: o cursor vai para o
       campo que precisa de atenção. */
    var campoEd = document.getElementById(
      (E.campoErro === 'f' ? 'ed-f-' : 'ed-i-') + E.editandoSprint);
    if(campoEd) campoEd.focus({ preventScroll:true });
  } else if(E.modal){
    var alvo = app.querySelector('.folha input, .folha select, .folha textarea, .folha button');
    if(alvo) alvo.focus({ preventScroll:true });
  }
}

/* pastilha do controle segmentado */
function posicionarSeg(){
  [].forEach.call(document.querySelectorAll('.seg'), function(seg){
    var at = seg.querySelector('[aria-selected="true"]'); if(!at) return;
    var p = seg.querySelector('.seg-p'); if(!p) return;
